<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../character builder/static/css/sheet.css">
  <style>
    body { padding: 3rem 1.2rem; }
    .back-btn{position:fixed;top:1.2rem;left:1.2rem;z-index:100;
      font-family:var(--font-heading);font-size:.60rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      padding:.45rem 1.1rem;background:rgba(255,250,248,.90);border:1px solid var(--border);
      border-radius:20px;color:var(--text-dim);text-decoration:none;transition:all .2s;
      backdrop-filter:blur(6px)}
    .back-btn:hover{border-color:var(--gold);color:var(--gold-dim);box-shadow:0 0 12px var(--gold-glow)}

    .tl-wrap { max-width: 900px; margin: 0 auto; }
    .tl-header { text-align: center; margin-bottom: 2rem; }
    .tl-ornament { font-size: 1.4rem; color: var(--gold); opacity: .55;
                   letter-spacing: .5em; display: block; margin-bottom: .8rem; }
    .tl-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700;
                color: var(--gold); letter-spacing: .1em;
                text-shadow: 0 0 32px var(--gold-glow), 0 0 8px rgba(185,155,80,.2);
                margin: 0 0 .4rem; }
    .tl-sub { font-size: .82rem; color: var(--text-dim); font-style: italic; font-family: var(--font-body); }

    .tl-tabs { display: flex; gap: .6rem; justify-content: center; margin-bottom: 1.6rem; }
    .tl-tab-btn { font-family: var(--font-heading); font-size: .70rem; font-weight: 700; letter-spacing: .10em;
      text-transform: uppercase; padding: 8px 20px; border-radius: 20px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-mid); color: var(--gold-dim); }
    .tl-tab-btn:hover { border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
    .tl-tab-btn.active { background: var(--gold-glow); border-color: var(--gold); }

    .step-panel { display: none; }
    .step-panel.active { display: block; }

    .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
             padding: 1.4rem 1.3rem; margin-bottom: 1.5rem; }
    .panel-title { font-family: var(--font-heading); font-size: .75rem; font-weight: 700;
                   letter-spacing: .1em; text-transform: uppercase; color: var(--gold-dim);
                   margin: 0 0 1rem; }

    /* ── Jump nav ── */
    .tl-jump-row { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.4rem;
      position: sticky; top: .5rem; z-index: 5; }
    .tl-jump-chip { font-family: var(--font-heading); font-size: .60rem; font-weight: 600; letter-spacing: .08em;
      padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer;
      background: rgba(255,248,245,.90); color: var(--text-dim); transition: all .15s; user-select: none;
      backdrop-filter: blur(4px); }
    .tl-jump-chip:hover { border-color: var(--gold); color: var(--gold-dim); }

    /* ── Timeline sub-view toggle ── */
    .tl-subtabs { display: flex; gap: .4rem; justify-content: center; margin-bottom: 1.2rem; }
    .tl-subtab-btn { font-family: var(--font-heading); font-size: .62rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 5px 14px; border-radius: 16px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-mid); color: var(--gold-dim); }
    .tl-subtab-btn:hover { border-color: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
    .tl-subtab-btn.active { background: var(--gold-glow); border-color: var(--gold); }

    /* ── Constellation view ── */
    #tl-constellation-scroll { overflow-x: auto; padding: 2rem 20px 1rem 100px; }
    #tl-const-track { position: relative; }
    #tl-const-connectors { position: absolute; top: 0; left: 0; pointer-events: none; }

    .tl-const-divider { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--border-mid); }
    .tl-const-divider-label { position: absolute; top: -1.4rem; font-size: .68rem; font-weight: 600;
      color: var(--text-dim); font-family: var(--font-heading); white-space: nowrap; transform: translateX(-50%); }
    .tl-const-divider-label-clickable { cursor: pointer; }
    .tl-const-divider-label-clickable:hover { color: var(--gold-dim); }

    .tl-const-node { position: absolute; width: 136px; height: 136px; border-radius: 50%;
      background: var(--bg-inset); border: 2px solid; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 8px 12px;
      box-sizing: border-box; cursor: pointer; transition: box-shadow .15s; }
    .tl-const-node:hover { box-shadow: 0 0 10px var(--gold-glow); }
    .tl-const-node-active { box-shadow: 0 0 0 3px var(--gold-glow-md); }
    .tl-const-star { width: 18px; height: 18px; }
    .tl-const-title { font-size: .74rem; font-weight: 700; color: var(--text); line-height: 1.2;
      margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tl-const-year { font-size: .65rem; color: var(--text-dim); margin-top: 4px; }

    .tl-const-detail-card { background: var(--bg-inset); border: 1px solid var(--border); border-radius: 8px;
      border-left: 4px solid var(--border-mid); padding: .8rem 1rem; margin-top: 1rem; max-width: 640px; margin-left: auto; margin-right: auto; }

    /* ── Timeline canvas + connector overlay ── */
    #tl-canvas { position: relative; max-width: 640px; margin: 0 auto; padding-right: 190px; box-sizing: border-box; overflow: visible; }
    #tl-connectors { position: absolute; top: 0; left: 0; pointer-events: none; }

    .tl-age-section { margin-bottom: 2.2rem; position: relative; z-index: 2; }
    .tl-age-heading { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--gold-dim);
      border-bottom: 2px solid var(--gold); padding-bottom: .35rem; margin-bottom: .8rem; }
    .tl-age-range { font-size: .68rem; color: var(--text-dim); font-style: italic; font-weight: 400;
      margin-left: .6rem; font-family: var(--font-body); }
    .tl-age-desc { font-size: .8rem; color: var(--text-mid); font-style: italic; margin-bottom: .8rem; }

    .tl-event-card { background: var(--bg-inset); border: 1px solid var(--border); border-radius: 8px;
      padding: .7rem .9rem; margin-bottom: .7rem; position: relative; }
    .tl-event-year { font-family: var(--font-heading); font-size: .62rem; font-weight: 700; color: var(--gold-dim);
      text-transform: uppercase; letter-spacing: .08em; }
    .tl-event-title { font-size: .92rem; font-weight: 700; color: var(--text); margin: .15rem 0 .3rem; padding-right: 1.4rem; }
    .tl-event-desc { font-size: .82rem; color: var(--text-mid); line-height: 1.55; }
    .tl-event-star { position: absolute; top: .55rem; right: .6rem; width: 16px; height: 16px; }

    .tl-empty { font-size: .8rem; color: var(--text-dim); font-style: italic; padding: 1rem 0; text-align: center; }

    /* ── Legend ── */
    #tl-legend { position: absolute; top: 0; right: 0; width: 168px; z-index: 3;
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
      padding: .7rem .8rem; }
    .tl-legend-title { font-family: var(--font-heading); font-size: .60rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: .5rem; }
    .tl-legend-item { display: flex; align-items: center; gap: .4rem; margin-bottom: .35rem; }
    .tl-legend-item:last-child { margin-bottom: 0; }
    .tl-legend-item svg { width: 13px; height: 13px; flex-shrink: 0; }
    .tl-legend-item span { font-size: .68rem; color: var(--text-mid); line-height: 1.2; }

    /* ── List rows (Manage tab) ── */
    .tl-row { display: flex; align-items: center; justify-content: space-between; gap: .6rem;
      padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-inset); margin-bottom: 6px; }
    .tl-row-info { display: flex; align-items: center; gap: .55rem; min-width: 0; }
    .tl-row-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .tl-row-name { font-size: .85rem; font-weight: 600; color: var(--text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .tl-row-sub { font-size: .68rem; color: var(--text-dim); font-style: italic; }
    .tl-row-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .tl-delete-btn { font-size: .85rem; padding: 4px 8px; border-radius: 4px; flex-shrink: 0;
      cursor: pointer; transition: background .1s; }
    .tl-delete-btn:hover { background: rgba(180,50,50,.15); color: #a33; }

    #ev-search { width: 100%; font-family: var(--font-body); font-size: .82rem;
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-mid);
      background: var(--bg-inset); color: var(--text); margin-bottom: .8rem; }

    /* ── Forms ── */
    .tl-form-row { display: flex; gap: .6rem; margin-bottom: .7rem; flex-wrap: wrap; }
    .tl-form-field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 110px; }
    .tl-form-field label { font-size: .6rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-dim); font-family: var(--font-heading); }
    .tl-form-field input, .tl-form-field select, .tl-form-field textarea {
      font-family: var(--font-body); font-size: .82rem; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); }
    .tl-form-field textarea { min-height: 70px; resize: vertical; }
    .tl-btn { font-family: var(--font-heading); font-size: .68rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 7px 16px; border-radius: 16px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-mid); color: var(--gold-dim); }
    .tl-btn:hover { border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
    .tl-btn-primary { background: var(--gold-glow); border-color: var(--gold); }
    .tl-form-status { font-size: .78rem; margin-top: .6rem; }
    .tl-form-hint { font-size: .68rem; color: var(--text-dim); font-style: italic; }

    /* ── Linked-events sub-list ── */
    #ev-link-rows { margin-bottom: .5rem; }
    .tl-link-row { display: flex; gap: .5rem; align-items: center; margin-bottom: .4rem; }
    .tl-link-row select { flex: 2; font-family: var(--font-body); font-size: .8rem; padding: 5px 7px;
      border-radius: 6px; border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); }
    .tl-link-row input { flex: 1; font-family: var(--font-body); font-size: .8rem; padding: 5px 7px;
      border-radius: 6px; border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); }
  </style>
</head>
<body>
<div class="page-texture"></div>

<a class="back-btn" href="../index.html">← Homepage</a>

<div class="tl-wrap">
  <header class="tl-header">
    <span class="tl-ornament">✦ ── ✦ ── ✦</span>
    <h1 class="tl-title">Timeline Builder</h1>
    <p class="tl-sub">Chart the ages and events of your world</p>
  </header>

  <div class="tl-tabs">
    <button class="tl-tab-btn active" onclick="switchTab('timeline', this)">Timeline</button>
    <button class="tl-tab-btn" onclick="switchTab('manage', this)">Manage</button>
  </div>

  <div class="step-panel active" id="tab-timeline">
    <div class="tl-subtabs">
      <button class="tl-subtab-btn active" onclick="switchTimelineView('classic', this)">Classic</button>
      <button class="tl-subtab-btn" onclick="switchTimelineView('constellation', this)">Constellation</button>
    </div>
    <div class="tl-jump-row" id="tl-jump-row"></div>
    <div id="tl-canvas">
      <svg id="tl-connectors">
        <defs>
          <marker id="tl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="var(--purple-bright)"/>
          </marker>
        </defs>
        <g id="tl-links-group"></g>
      </svg>
      <div id="tl-legend"></div>
      <div id="tl-sections"></div>
    </div>

    <div id="tl-constellation" style="display:none">
      <div id="tl-constellation-scroll">
        <div id="tl-const-track">
          <svg id="tl-const-connectors">
            <defs>
              <marker id="tl-const-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M0,0 L10,5 L0,10 Z" fill="var(--purple-bright)"/>
              </marker>
            </defs>
            <g id="tl-const-links-group"></g>
          </svg>
          <div id="tl-const-dividers"></div>
          <div id="tl-const-nodes"></div>
        </div>
      </div>
      <div id="tl-const-detail"></div>
    </div>
  </div>

  <div class="step-panel" id="tab-manage">
    <section class="panel">
      <div class="panel-title">Ages</div>
      <div id="age-list"></div>
      <hr style="border:none;border-top:1px dashed var(--border);margin:1rem 0">
      <div id="age-form">
        <div class="tl-form-row">
          <div class="tl-form-field" style="flex:2"><label>Name</label><input type="text" id="age-name"></div>
          <div class="tl-form-field"><label>Start Year</label><input type="number" id="age-start"></div>
          <div class="tl-form-field"><label>End Year (optional)</label><input type="number" id="age-end" placeholder="ongoing"></div>
          <div class="tl-form-field"><label>Abbreviation (optional)</label><input type="text" id="age-abbr" placeholder="PAA"></div>
        </div>
        <div class="tl-form-row">
          <div class="tl-form-field" style="flex:1"><label>Description</label><textarea id="age-desc"></textarea></div>
        </div>
        <button class="tl-btn tl-btn-primary" onclick="submitAge()">Add Age</button>
        <div class="tl-form-status" id="age-status"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Events</div>
      <input type="text" id="ev-search" placeholder="Search by title" oninput="renderEventList()">
      <div id="event-list"></div>
      <hr style="border:none;border-top:1px dashed var(--border);margin:1rem 0">
      <div id="event-form">
        <div class="tl-form-row">
          <div class="tl-form-field" style="flex:2"><label>Title</label><input type="text" id="ev-title"></div>
          <div class="tl-form-field">
            <label id="ev-year-label">Year</label>
            <input type="number" id="ev-year" oninput="updateYearHint()">
            <span class="tl-form-hint" id="ev-year-hint"></span>
          </div>
        </div>
        <div class="tl-form-row">
          <div class="tl-form-field"><label>Age</label><select id="ev-age" onchange="updateYearHint()"></select></div>
          <div class="tl-form-field"><label>Event Type (optional)</label><select id="ev-type"></select></div>
        </div>
        <div class="tl-form-row">
          <div class="tl-form-field" style="flex:1"><label>Description</label><textarea id="ev-desc"></textarea></div>
        </div>
        <div class="tl-form-row">
          <div class="tl-form-field" style="flex:1">
            <label>Linked Events (causal / related)</label>
            <div id="ev-link-rows"></div>
            <button type="button" class="tl-btn" onclick="addLinkRow()">+ Add Link</button>
            <div id="ev-linked-from" style="margin-top:.5rem"></div>
          </div>
        </div>
        <button class="tl-btn tl-btn-primary" onclick="submitEvent()">Add Event</button>
        <div class="tl-form-status" id="ev-status"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js?v=1"></script>
<script src="js/auth.js?v=1"></script>
<script>
let ages = [];
let events = [];
let links = [];
let editingAgeId = null;
let editingEventId = null;
let formLinks = [];
let timelineView = 'classic';

const EVENT_TYPES = {
  cosmic:     { label: 'Cosmic Events',       color: '#5b4b9e' },
  geological: { label: 'Geological Events',   color: '#8b5a2b' },
  settlement: { label: 'Settlement Founding', color: '#d4a017' },
  origins:    { label: 'Origins',             color: '#4a9b5e' },
  conflict:   { label: 'Conflicts',           color: '#b8283a' },
  societal:   { label: 'Societal Events',     color: '#2f8f9e' },
};
const STAR_PATH = 'M12 2 L14.9 8.9 L22 9.3 L16.5 14 L18.2 21 L12 17.3 L5.8 21 L7.5 14 L2 9.3 L9.1 8.9 Z';
const CONST_X_STEP = 260, CONST_BASELINE_Y = 230, CONST_AMP_MIN = 85, CONST_AMP_RANGE = 55, CONST_NODE_R = 68;

function starIcon(color, title) {
  return '<svg viewBox="0 0 24 24" style="fill:' + color + '"' + (title ? ' title="' + title + '"' : '') + '><path d="' + STAR_PATH + '"/></svg>';
}

function starBadge(e) {
  const t = EVENT_TYPES[e.event_type];
  if (!t) return '';
  return '<svg class="tl-event-star" viewBox="0 0 24 24" style="fill:' + t.color + '"><title>' + t.label + '</title><path d="' + STAR_PATH + '"/></svg>';
}

function populateEventTypeSelect() {
  const sel = document.getElementById('ev-type');
  sel.innerHTML = '<option value="">— none —</option>' +
    Object.entries(EVENT_TYPES).map(([key, t]) => '<option value="' + key + '">' + t.label + '</option>').join('');
}

function renderLegend() {
  const el = document.getElementById('tl-legend');
  el.innerHTML = '<div class="tl-legend-title">Event Types</div>' +
    Object.values(EVENT_TYPES).map(t => '<div class="tl-legend-item">' + starIcon(t.color) + '<span>' + t.label + '</span></div>').join('');
}

// ─── Year/range formatting ─────────────────────────────────────────────────
function formatAgeRange(a) {
  if (a.abbreviation) {
    const endRel = a.end_year != null ? (a.end_year - a.start_year) : null;
    return '0 – ' + (endRel != null ? endRel : 'present') + ' ' + a.abbreviation;
  }
  return a.start_year + ' – ' + (a.end_year != null ? a.end_year : 'present');
}

function formatEventYear(e) {
  const age = ages.find(a => a.id === e.age_id);
  if (age && age.abbreviation) return (e.year - age.start_year) + ' ' + age.abbreviation;
  return 'Year ' + e.year;
}

function updateYearHint() {
  const ageId = document.getElementById('ev-age').value;
  const yearRaw = document.getElementById('ev-year').value;
  const yearVal = parseInt(yearRaw, 10);
  const label = document.getElementById('ev-year-label');
  const hint = document.getElementById('ev-year-hint');
  const age = ages.find(a => a.id === ageId);
  if (age) {
    label.textContent = 'Year (relative to ' + age.name + ')';
    if (!isNaN(yearVal)) {
      const abs = age.start_year + yearVal;
      hint.textContent = '= absolute year ' + abs + (age.abbreviation ? ' · displays as "' + yearVal + ' ' + age.abbreviation + '"' : '');
    } else {
      hint.textContent = '';
    }
  } else {
    label.textContent = 'Year (absolute)';
    hint.textContent = '';
  }
}

// ─── Tabs ────────────────────────────────────────────────────────────────────
function switchTab(tab, btn) {
  document.querySelectorAll('.tl-tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-timeline').classList.toggle('active', tab === 'timeline');
  document.getElementById('tab-manage').classList.toggle('active', tab === 'manage');
  if (tab === 'timeline') {
    requestAnimationFrame(() => requestAnimationFrame(drawConnectors));
  }
}

function switchTimelineView(view, btn) {
  timelineView = view;
  document.querySelectorAll('.tl-subtab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tl-canvas').style.display = view === 'classic' ? '' : 'none';
  document.getElementById('tl-constellation').style.display = view === 'constellation' ? '' : 'none';
  if (view === 'classic') {
    requestAnimationFrame(() => requestAnimationFrame(drawConnectors));
  }
}

// ─── Load ────────────────────────────────────────────────────────────────────
async function loadAll() {
  const [agesRes, eventsRes, linksRes] = await Promise.all([
    supabase.from('timeline_ages').select('*').order('start_year', { ascending: true }),
    supabase.from('timeline_events').select('*').order('year', { ascending: true }).order('created_at', { ascending: true }),
    supabase.from('timeline_links').select('*'),
  ]);
  ages = agesRes.data || [];
  events = eventsRes.data || [];
  links = linksRes.data || [];
  renderAgeList();
  populateAgeSelect();
  renderEventList();
  renderTimeline();
  renderConstellation();
}

// ─── Ages ────────────────────────────────────────────────────────────────────
function renderAgeList() {
  const el = document.getElementById('age-list');
  if (!ages.length) { el.innerHTML = '<div class="tl-empty">No ages yet.</div>'; return; }
  el.innerHTML = ages.slice().sort((a, b) => a.start_year - b.start_year).map(a => {
    const name = a.name + (a.abbreviation ? ' (' + a.abbreviation + ')' : '');
    return '<div class="tl-row">' +
      '<div class="tl-row-info"><div class="tl-row-text"><span class="tl-row-name">' + name + '</span>' +
      '<span class="tl-row-sub">' + formatAgeRange(a) + '</span></div></div>' +
      '<div class="tl-row-actions">' +
        '<span class="tl-delete-btn" title="Edit" onclick="startEditAge(\'' + a.id + '\')">✏</span>' +
        '<span class="tl-delete-btn" title="Delete" onclick="deleteAge(\'' + a.id + '\')">🗑</span>' +
      '</div></div>';
  }).join('');
}

function resetAgeForm() {
  editingAgeId = null;
  document.getElementById('age-name').value = '';
  document.getElementById('age-start').value = '';
  document.getElementById('age-end').value = '';
  document.getElementById('age-abbr').value = '';
  document.getElementById('age-desc').value = '';
  document.querySelector('#age-form button.tl-btn-primary').textContent = 'Add Age';
  document.getElementById('age-status').textContent = '';
}

function startEditAge(id) {
  const a = ages.find(x => x.id === id);
  if (!a) return;
  editingAgeId = id;
  document.getElementById('age-name').value = a.name;
  document.getElementById('age-start').value = a.start_year;
  document.getElementById('age-end').value = a.end_year ?? '';
  document.getElementById('age-abbr').value = a.abbreviation || '';
  document.getElementById('age-desc').value = a.description || '';
  document.querySelector('#age-form button.tl-btn-primary').textContent = 'Save Changes';
}

async function submitAge() {
  const status = document.getElementById('age-status');
  status.style.color = '';
  const name = document.getElementById('age-name').value.trim();
  const startRaw = document.getElementById('age-start').value;
  const startYear = parseInt(startRaw, 10);
  const endRaw = document.getElementById('age-end').value.trim();
  const endYear = endRaw === '' ? null : parseInt(endRaw, 10);
  const abbreviation = document.getElementById('age-abbr').value.trim() || null;
  const description = document.getElementById('age-desc').value.trim();

  if (!name) { status.textContent = 'Name is required.'; return; }
  if (startRaw.trim() === '' || isNaN(startYear)) { status.textContent = 'Start year is required.'; return; }
  if (endYear !== null && endYear < startYear) { status.textContent = 'End year must be after start year.'; return; }

  const { data: { user } } = await supabase.auth.getUser();
  const row = { owner_id: user.id, name, start_year: startYear, end_year: endYear, abbreviation, description };

  let error;
  if (editingAgeId) {
    ({ error } = await supabase.from('timeline_ages').update(row).eq('id', editingAgeId));
  } else {
    ({ error } = await supabase.from('timeline_ages').insert(row));
  }
  if (error) { status.textContent = 'Failed: ' + error.message; return; }

  status.style.color = '#2d7a3a';
  status.textContent = editingAgeId ? '✓ Saved' : '✓ Created';
  const wasEditing = editingAgeId;
  await loadAll();
  setTimeout(() => { resetAgeForm(); }, 900);
}

async function deleteAge(id) {
  const count = events.filter(e => e.age_id === id).length;
  const msg = count
    ? ('Delete this Age? ' + count + ' event(s) will become Unassigned (they will not be deleted).')
    : 'Delete this Age?';
  if (!confirm(msg)) return;
  const { error } = await supabase.from('timeline_ages').delete().eq('id', id);
  if (error) { alert('Failed to delete: ' + error.message); return; }
  await loadAll();
}

// ─── Events ──────────────────────────────────────────────────────────────────
function populateAgeSelect() {
  const sel = document.getElementById('ev-age');
  const current = sel.value;
  sel.innerHTML = '<option value="">— Unassigned —</option>' +
    ages.slice().sort((a, b) => a.start_year - b.start_year)
      .map(a => '<option value="' + a.id + '">' + a.name + '</option>').join('');
  if (current) sel.value = current;
}

function renderEventList() {
  const q = document.getElementById('ev-search').value.trim().toLowerCase();
  const el = document.getElementById('event-list');
  const filtered = events.filter(e => !q || e.title.toLowerCase().includes(q));
  if (!filtered.length) { el.innerHTML = '<div class="tl-empty">No events match.</div>'; return; }
  el.innerHTML = filtered.map(e => {
    const age = ages.find(a => a.id === e.age_id);
    return '<div class="tl-row">' +
      '<div class="tl-row-info"><div class="tl-row-text"><span class="tl-row-name">' + e.title + '</span>' +
      '<span class="tl-row-sub">' + formatEventYear(e) + ' · ' + (age ? age.name : 'Unassigned') + '</span></div></div>' +
      '<div class="tl-row-actions">' +
        '<span class="tl-delete-btn" title="Edit" onclick="startEditEvent(\'' + e.id + '\')">✏</span>' +
        '<span class="tl-delete-btn" title="Delete" onclick="deleteEvent(\'' + e.id + '\')">🗑</span>' +
      '</div></div>';
  }).join('');
}

function resetEventForm() {
  editingEventId = null;
  formLinks = [];
  document.getElementById('ev-title').value = '';
  document.getElementById('ev-year').value = '';
  document.getElementById('ev-desc').value = '';
  document.getElementById('ev-age').value = '';
  document.getElementById('ev-type').value = '';
  document.getElementById('ev-linked-from').innerHTML = '';
  renderLinkRows();
  updateYearHint();
  document.querySelector('#event-form button.tl-btn-primary').textContent = 'Add Event';
  document.getElementById('ev-status').textContent = '';
}

function renderLinkRows() {
  const el = document.getElementById('ev-link-rows');
  el.innerHTML = formLinks.map((l, i) => {
    const usedIds = formLinks.map(fl => fl.toEventId);
    const options = events
      .filter(e => e.id !== editingEventId && (e.id === l.toEventId || !usedIds.includes(e.id)))
      .map(e => '<option value="' + e.id + '"' + (e.id === l.toEventId ? ' selected' : '') + '>' + e.title + '</option>')
      .join('');
    return '<div class="tl-link-row">' +
      '<select onchange="updateLinkTarget(' + i + ', this.value)"><option value="">— choose event —</option>' + options + '</select>' +
      '<input type="text" placeholder="e.g. caused, led to" value="' + (l.label || '') + '" oninput="updateLinkLabel(' + i + ', this.value)">' +
      '<span class="tl-delete-btn" onclick="removeLinkRow(' + i + ')">✕</span>' +
    '</div>';
  }).join('');
}

function addLinkRow() { formLinks.push({ toEventId: '', label: '' }); renderLinkRows(); }
function updateLinkTarget(i, val) { formLinks[i].toEventId = val; renderLinkRows(); }
function updateLinkLabel(i, val) { formLinks[i].label = val; }
function removeLinkRow(i) { formLinks.splice(i, 1); renderLinkRows(); }

async function startEditEvent(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  editingEventId = id;
  document.getElementById('ev-title').value = e.title;
  document.getElementById('ev-desc').value = e.description || '';
  document.getElementById('ev-age').value = e.age_id || '';
  document.getElementById('ev-type').value = e.event_type || '';
  const age = ages.find(a => a.id === e.age_id);
  document.getElementById('ev-year').value = age ? (e.year - age.start_year) : e.year;
  updateYearHint();
  formLinks = links.filter(l => l.from_event_id === id).map(l => ({ toEventId: l.to_event_id, label: l.label || '' }));
  renderLinkRows();
  document.querySelector('#event-form button.tl-btn-primary').textContent = 'Save Changes';

  const { data: incoming } = await supabase.from('timeline_links').select('from_event_id, label').eq('to_event_id', id);
  const fromEl = document.getElementById('ev-linked-from');
  if (incoming && incoming.length) {
    const parts = incoming.map(l => {
      const src = events.find(ev => ev.id === l.from_event_id);
      return (src ? src.title : 'Unknown') + (l.label ? ' (' + l.label + ')' : '');
    });
    fromEl.innerHTML = '<span class="tl-form-hint">Linked from: ' + parts.join(', ') + '</span>';
  } else {
    fromEl.innerHTML = '';
  }
}

async function submitEvent() {
  const status = document.getElementById('ev-status');
  status.style.color = '';
  const title = document.getElementById('ev-title').value.trim();
  const yearRaw = document.getElementById('ev-year').value;
  const enteredYear = parseInt(yearRaw, 10);
  const description = document.getElementById('ev-desc').value.trim();
  const ageId = document.getElementById('ev-age').value || null;
  const eventType = document.getElementById('ev-type').value || null;

  if (!title) { status.textContent = 'Title is required.'; return; }
  if (yearRaw.trim() === '' || isNaN(enteredYear)) { status.textContent = 'Year is required.'; return; }

  const age = ages.find(a => a.id === ageId);
  const year = age ? (age.start_year + enteredYear) : enteredYear;

  if (age && (year < age.start_year || (age.end_year != null && year > age.end_year))) {
    const shownYear = age.abbreviation ? (enteredYear + ' ' + age.abbreviation) : year;
    if (!confirm("This event's year (" + shownYear + ') falls outside ' + age.name + "'s range (" + formatAgeRange(age) + '). Save anyway?')) return;
  }

  const validLinks = formLinks.filter(l => l.toEventId);
  const targetIds = validLinks.map(l => l.toEventId);
  if (new Set(targetIds).size !== targetIds.length) {
    status.textContent = 'Duplicate linked event — remove the repeat.';
    return;
  }

  const { data: { user } } = await supabase.auth.getUser();
  const row = { owner_id: user.id, age_id: ageId, title, year, description, event_type: eventType };

  let error, eventId;
  if (editingEventId) {
    eventId = editingEventId;
    ({ error } = await supabase.from('timeline_events').update(row).eq('id', eventId));
  } else {
    const { data: inserted, error: insertErr } = await supabase.from('timeline_events').insert(row).select('id').single();
    error = insertErr;
    eventId = inserted ? inserted.id : null;
  }
  if (error) { status.textContent = 'Failed: ' + error.message; return; }

  await supabase.from('timeline_links').delete().eq('from_event_id', eventId);
  if (validLinks.length) {
    const linkRows = validLinks.map(l => ({ owner_id: user.id, from_event_id: eventId, to_event_id: l.toEventId, label: l.label.trim() || null }));
    const { error: linkErr } = await supabase.from('timeline_links').insert(linkRows);
    if (linkErr) { status.textContent = 'Event saved, but links failed: ' + linkErr.message; await loadAll(); return; }
  }

  status.style.color = '#2d7a3a';
  status.textContent = editingEventId ? '✓ Saved' : '✓ Created';
  await loadAll();
  setTimeout(() => { resetEventForm(); }, 900);
}

async function deleteEvent(id) {
  if (!confirm('Delete this event? Any causal links to or from it will also be removed.')) return;
  const { error } = await supabase.from('timeline_events').delete().eq('id', id);
  if (error) { alert('Failed to delete: ' + error.message); return; }
  await loadAll();
}

// ─── Timeline visual view ────────────────────────────────────────────────────
function renderEventCard(e) {
  return '<div class="tl-event-card" data-event-id="' + e.id + '">' +
    starBadge(e) +
    '<div class="tl-event-year">' + formatEventYear(e) + '</div>' +
    '<div class="tl-event-title">' + e.title + '</div>' +
    (e.description ? '<div class="tl-event-desc">' + e.description + '</div>' : '') +
  '</div>';
}

function renderTimeline() {
  const el = document.getElementById('tl-sections');
  const jump = document.getElementById('tl-jump-row');

  if (!ages.length && !events.length) {
    el.innerHTML = '<div class="tl-empty">No ages or events yet — head to Manage to start building your world\'s history.</div>';
    jump.innerHTML = '';
    return;
  }

  const sortedAges = ages.slice().sort((a, b) => a.start_year - b.start_year);
  const unassigned = events.filter(e => !e.age_id).sort((a, b) => a.year - b.year || new Date(a.created_at) - new Date(b.created_at));

  jump.innerHTML = sortedAges.map(a => '<span class="tl-jump-chip" onclick="jumpToAge(\'' + a.id + '\')">' + a.name + '</span>').join('') +
    (unassigned.length ? '<span class="tl-jump-chip" onclick="jumpToAge(\'unassigned\')">Unassigned</span>' : '');

  const ageSections = sortedAges.map(a => {
    const ageEvents = events.filter(e => e.age_id === a.id).sort((x, y) => x.year - y.year || new Date(x.created_at) - new Date(y.created_at));
    return '<div class="tl-age-section" id="age-section-' + a.id + '">' +
      '<div class="tl-age-heading">' + a.name + '<span class="tl-age-range">' + formatAgeRange(a) + '</span></div>' +
      (a.description ? '<div class="tl-age-desc">' + a.description + '</div>' : '') +
      (ageEvents.length ? ageEvents.map(renderEventCard).join('') : '<div class="tl-empty">No events in this age yet.</div>') +
    '</div>';
  }).join('');

  const unassignedSection = unassigned.length
    ? '<div class="tl-age-section" id="age-section-unassigned"><div class="tl-age-heading">Unassigned</div>' +
      unassigned.map(renderEventCard).join('') + '</div>'
    : '';

  el.innerHTML = ageSections + unassignedSection;
  drawConnectors();
}

function jumpToAge(id) {
  if (timelineView === 'constellation') {
    const wrapper = document.getElementById('tl-constellation-scroll');
    const { dividers } = buildConstellationLayout();
    const d = id === 'unassigned' ? dividers.find(dv => dv.id === null) : dividers.find(dv => dv.id === id);
    if (wrapper && d) wrapper.scrollTo({ left: Math.max(0, d.x - 40), behavior: 'smooth' });
    return;
  }
  const el = document.getElementById('age-section-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── SVG connector overlay ────────────────────────────────────────────────────
function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// ─── Constellation view ──────────────────────────────────────────────────────
function buildConstellationLayout() {
  const sortedAges = ages.slice().sort((a, b) => a.start_year - b.start_year);
  const positions = {};
  const dividers = [];
  let i = 0;

  sortedAges.forEach(age => {
    const ageEvents = events.filter(e => e.age_id === age.id).sort((x, y) => x.year - y.year || new Date(x.created_at) - new Date(y.created_at));
    const dividerX = i === 0 ? 20 : (i * CONST_X_STEP - CONST_X_STEP / 2);
    dividers.push({ x: dividerX, label: age.name, id: age.id });

    // Events that fall exactly on the age's start year snap onto the divider
    // line itself, stacked one above/below the other if there's more than one.
    const onLine = ageEvents.filter(e => e.year === age.start_year);
    const rest = ageEvents.filter(e => e.year !== age.start_year);

    if (onLine.length) {
      onLine.forEach((e, idx) => {
        const dir = idx % 2 === 0 ? -1 : 1;
        const step = Math.ceil((idx + 1) / 2);
        positions[e.id] = { x: dividerX, y: CONST_BASELINE_Y + dir * step * 90 };
      });
      i++;
    }

    rest.forEach(e => {
      const amp = CONST_AMP_MIN + (hashCode(e.id) % CONST_AMP_RANGE);
      positions[e.id] = { x: i * CONST_X_STEP + 150, y: CONST_BASELINE_Y + (i % 2 === 0 ? -amp : amp) };
      i++;
    });
  });

  const unassigned = events.filter(e => !e.age_id).sort((a, b) => a.year - b.year || new Date(a.created_at) - new Date(b.created_at));
  if (unassigned.length) {
    dividers.push({ x: i === 0 ? 20 : (i * CONST_X_STEP - CONST_X_STEP / 2), label: 'Unassigned', id: null });
    unassigned.forEach(e => {
      const amp = CONST_AMP_MIN + (hashCode(e.id) % CONST_AMP_RANGE);
      positions[e.id] = { x: i * CONST_X_STEP + 150, y: CONST_BASELINE_Y + (i % 2 === 0 ? -amp : amp) };
      i++;
    });
  }

  const totalWidth = Math.max(i * CONST_X_STEP + 200, 400);
  const totalHeight = (CONST_BASELINE_Y + CONST_AMP_MIN + CONST_AMP_RANGE + CONST_NODE_R) * 2;
  return { positions, dividers, totalWidth, totalHeight };
}

function renderConstellationNode(e, pos) {
  const t = EVENT_TYPES[e.event_type];
  const color = t ? t.color : 'var(--border-mid)';
  return '<div class="tl-const-node" data-event-id="' + e.id + '" style="left:' + (pos.x - CONST_NODE_R) + 'px; top:' + (pos.y - CONST_NODE_R) + 'px; border-color:' + color + '" onclick="showConstellationDetail(\'' + e.id + '\')">' +
    (t ? '<svg class="tl-const-star" viewBox="0 0 24 24" style="fill:' + color + '"><path d="' + STAR_PATH + '"/></svg>' : '') +
    '<span class="tl-const-title">' + e.title + '</span>' +
    '<span class="tl-const-year">' + formatEventYear(e) + '</span>' +
  '</div>';
}

function renderConstellation() {
  const track = document.getElementById('tl-const-track');
  if (!track) return;

  if (!events.length) {
    track.style.width = '100%';
    track.style.height = '80px';
    document.getElementById('tl-const-dividers').innerHTML = '';
    document.getElementById('tl-const-nodes').innerHTML = '<div class="tl-empty">No events yet — head to Manage to start building your world\'s history.</div>';
    document.getElementById('tl-const-connectors').querySelector('#tl-const-links-group').innerHTML = '';
    return;
  }

  const { positions, dividers, totalWidth, totalHeight } = buildConstellationLayout();
  track.style.width = totalWidth + 'px';
  track.style.height = totalHeight + 'px';

  document.getElementById('tl-const-dividers').innerHTML = dividers.map(d => {
    const labelStyle = 'left:' + d.x + 'px' + (d.x < 80 ? '; transform:none' : '');
    return '<div class="tl-const-divider" style="left:' + d.x + 'px"></div>' +
      '<div class="tl-const-divider-label' + (d.id ? ' tl-const-divider-label-clickable' : '') + '" style="' + labelStyle + '"' +
        (d.id ? ' onclick="showConstellationAgeDetail(\'' + d.id + '\')"' : '') + '>✦ ' + d.label + ' ✦</div>';
  }).join('');

  document.getElementById('tl-const-nodes').innerHTML = events
    .filter(e => positions[e.id])
    .map(e => renderConstellationNode(e, positions[e.id]))
    .join('');

  const svg = document.getElementById('tl-const-connectors');
  svg.setAttribute('width', totalWidth);
  svg.setAttribute('height', totalHeight);
  svg.setAttribute('viewBox', '0 0 ' + totalWidth + ' ' + totalHeight);
  svg.querySelector('#tl-const-links-group').innerHTML = links.map(link => {
    const p1 = positions[link.from_event_id], p2 = positions[link.to_event_id];
    if (!p1 || !p2) return '';
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    const x1 = p1.x + ux * CONST_NODE_R, y1 = p1.y + uy * CONST_NODE_R;
    const x2 = p2.x - ux * CONST_NODE_R, y2 = p2.y - uy * CONST_NODE_R;
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--purple-bright)" stroke-width="1.5" marker-end="url(#tl-const-arrow)"></line>';
  }).join('');
}

function showConstellationDetail(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  const t = EVENT_TYPES[e.event_type];
  document.getElementById('tl-const-detail').innerHTML =
    '<div class="tl-const-detail-card" style="border-left-color:' + (t ? t.color : 'var(--border-mid)') + '">' +
      '<div class="tl-event-title">' + e.title + '</div>' +
      '<div class="tl-event-year">' + formatEventYear(e) + '</div>' +
      (e.description ? '<div class="tl-event-desc" style="margin-top:.4rem">' + e.description + '</div>' : '') +
    '</div>';
  document.querySelectorAll('.tl-const-node').forEach(n => n.classList.toggle('tl-const-node-active', n.dataset.eventId === id));
}

function showConstellationAgeDetail(id) {
  const a = ages.find(x => x.id === id);
  if (!a) return;
  document.querySelectorAll('.tl-const-node').forEach(n => n.classList.remove('tl-const-node-active'));
  document.getElementById('tl-const-detail').innerHTML =
    '<div class="tl-const-detail-card" style="border-left-color:var(--gold)">' +
      '<div class="tl-event-title">' + a.name + '</div>' +
      '<div class="tl-event-year">' + formatAgeRange(a) + '</div>' +
      (a.description ? '<div class="tl-event-desc" style="margin-top:.4rem">' + a.description + '</div>'
        : '<div class="tl-event-desc" style="margin-top:.4rem;font-style:italic">No description yet.</div>') +
    '</div>';
}

function drawConnectors() {
  const container = document.getElementById('tl-canvas');
  const sections = document.getElementById('tl-sections');
  const svg = document.getElementById('tl-connectors');
  if (!container || !svg) return;
  const cRect = container.getBoundingClientRect();
  // Measure height from the content div, not the canvas itself — the canvas's own
  // scrollHeight includes this absolutely-positioned svg, which would otherwise
  // feed back into its own size on every redraw.
  const contentHeight = sections.scrollHeight;
  svg.setAttribute('width', container.clientWidth);
  svg.setAttribute('height', contentHeight);
  svg.setAttribute('viewBox', '0 0 ' + container.clientWidth + ' ' + contentHeight);

  const group = svg.querySelector('#tl-links-group');
  group.innerHTML = links.map(link => {
    const fromEl = container.querySelector('[data-event-id="' + link.from_event_id + '"]');
    const toEl = container.querySelector('[data-event-id="' + link.to_event_id + '"]');
    if (!fromEl || !toEl) return '';

    const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect();
    const x1 = fr.right - cRect.left, y1 = fr.top + fr.height / 2 - cRect.top;
    const x2 = tr.right - cRect.left, y2 = tr.top + tr.height / 2 - cRect.top;

    const dy = Math.abs(y2 - y1);
    let bulge = Math.min(160, Math.max(40, 40 + dy * 0.15));
    bulge += (hashCode(link.id) % 5) * 8;

    return '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + bulge) + ' ' + y1 + ', ' + (x2 + bulge) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '"' +
      ' fill="none" stroke="var(--purple-bright)" stroke-width="2"' +
      ' marker-end="url(#tl-arrow)" pointer-events="auto"' +
      ' data-link-id="' + link.id + '" data-from="' + link.from_event_id + '" data-to="' + link.to_event_id + '"></path>';
  }).join('');
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawConnectors, 150);
});

// ─── Init ────────────────────────────────────────────────────────────────────
(async function init() {
  await requireAuth();
  populateEventTypeSelect();
  renderLegend();
  await loadAll();
})();
</script>
