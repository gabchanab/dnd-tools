<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Pinboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../character builder/static/css/sheet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    [hidden] { display: none !important; }
    body { padding: 3rem 1.2rem 2rem; }

    .back-btn{position:fixed;top:1.2rem;left:1.2rem;z-index:1000;
      font-family:var(--font-heading);font-size:.60rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      padding:.45rem 1.1rem;background:rgba(255,250,248,.90);border:1px solid var(--border);
      border-radius:20px;color:var(--text-dim);text-decoration:none;transition:all .2s;
      backdrop-filter:blur(6px)}
    .back-btn:hover{border-color:var(--gold);color:var(--gold-dim);box-shadow:0 0 12px var(--gold-glow)}

    .mp-wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }
    .mp-header { text-align: center; margin-bottom: 2rem; }
    .mp-ornament { font-size: 1.4rem; color: var(--gold); opacity: .55; letter-spacing: .5em; display: block; margin-bottom: .8rem; }
    .mp-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--gold);
                letter-spacing: .1em; text-shadow: 0 0 32px var(--gold-glow), 0 0 8px rgba(185,155,80,.2); margin: 0 0 .4rem; }
    .mp-sub { font-size: .82rem; color: var(--text-dim); font-style: italic; font-family: var(--font-body); }

    .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
             padding: 1.4rem 1.3rem; margin-bottom: 1.5rem; }
    .panel-title { font-family: var(--font-heading); font-size: .75rem; font-weight: 700; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--gold-dim); margin: 0 0 1rem; }

    /* ── Forms / buttons (same look as the timeline tool) ── */
    .mp-form-row { display: flex; gap: .6rem; margin-bottom: .7rem; flex-wrap: wrap; }
    .mp-form-field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 140px; }
    .mp-form-field label { font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); font-family: var(--font-heading); }
    .mp-form-field input, .mp-form-field select, .mp-form-field textarea {
      font-family: var(--font-body); font-size: .82rem; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); width: 100%; }
    .mp-form-field textarea { min-height: 90px; resize: vertical; }
    .mp-btn { font-family: var(--font-heading); font-size: .68rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 7px 16px; border-radius: 16px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-mid); color: var(--gold-dim); }
    .mp-btn:hover:not(:disabled) { border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
    .mp-btn:disabled { opacity: .5; cursor: default; }
    .mp-btn-primary { background: var(--gold-glow); border-color: var(--gold); }
    .mp-btn-active { background: var(--gold-glow-md); border-color: var(--gold); }
    .mp-btn-danger:hover:not(:disabled) { border-color: #a33; color: #a33; box-shadow: none; }
    .mp-status { font-size: .78rem; margin-top: .6rem; color: var(--text-mid); }
    .mp-status.err { color: #a33; }
    .mp-hint { font-size: .68rem; color: var(--text-dim); font-style: italic; }
    .mp-empty { font-size: .8rem; color: var(--text-dim); font-style: italic; padding: 1rem 0; text-align: center; }

    /* ── Map list ── */
    .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .mp-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
               display: flex; flex-direction: column; transition: border-color .2s, box-shadow .2s, transform .15s; }
    .mp-card:hover { border-color: var(--gold); box-shadow: 0 0 18px var(--gold-glow), 0 4px 20px rgba(0,0,0,.12); transform: translateY(-2px); }
    .mp-card-thumb { height: 140px; background: var(--bg-warm) center / cover no-repeat; display: flex; align-items: center;
                     justify-content: center; font-size: 2rem; color: var(--gold); opacity: .9; cursor: pointer; }
    .mp-card-body { padding: .8rem .9rem .9rem; display: flex; flex-direction: column; gap: .35rem; }
    .mp-card-name { font-family: var(--font-heading); font-size: .95rem; font-weight: 700; color: var(--text); cursor: pointer;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-card-sub { font-size: .68rem; color: var(--text-dim); font-style: italic; }
    .mp-card-actions { display: flex; gap: .4rem; margin-top: .3rem; }

    /* ── Map view ── */
    #view-map .mp-wrap { max-width: 1500px; }
    .mv-toolbar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .mv-name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--gold-dim); letter-spacing: .06em; margin-right: auto; }
    .mv-body { display: grid; grid-template-columns: 1fr 330px; gap: 1rem; height: calc(100vh - 8.5rem); min-height: 440px; }
    .mv-filters:not([hidden]) + .mv-body { height: calc(100vh - 11.2rem); }
    .mv-mapbox { position: relative; border: 1px solid var(--border-mid); border-radius: 10px; overflow: hidden; background: var(--bg-warm); }
    #map { position: absolute; inset: 0; background: var(--bg-warm); font-family: var(--font-body); }
    #map.adding, #map.adding .leaflet-interactive { cursor: crosshair; }
    .mv-banner { position: absolute; top: .7rem; left: 50%; transform: translateX(-50%); z-index: 800;
                 background: rgba(255,250,248,.94); border: 1px solid var(--gold); border-radius: 20px; padding: .35rem 1rem;
                 font-size: .75rem; color: var(--gold-dim); box-shadow: 0 0 12px var(--gold-glow); pointer-events: none; }
    .panel { resize: none; }
    .mv-side { overflow-y: auto; overflow-x: hidden; margin: 0; }

    .pin-wrap { background: none; border: none; }
    .pin { width: 30px; height: 30px; border-radius: 50%; background: #fffaf5; border: 3px solid var(--c, #6b4f9a);
           display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1;
           box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .12s; }
    .pin-wrap:hover .pin { transform: scale(1.12); }
    .pin.selected { transform: scale(1.25); box-shadow: 0 0 0 4px var(--gold-glow-md), 0 2px 8px rgba(0,0,0,.4); }
    .pin.draft { border-style: dashed; }
    .pin { position: relative; }
    .pin-badge { position: absolute; right: -7px; bottom: -7px; width: 17px; height: 17px; border-radius: 50%;
      background: var(--gold); color: #fff; border: 1.5px solid #fffaf5; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; }

    .mv-crumbs { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .mv-crumb-sep { color: var(--text-dim); font-size: .8rem; }
    .mv-crumb { font-family: var(--font-heading); font-size: .66rem; font-weight: 600; letter-spacing: .06em; padding: 5px 12px;
      border-radius: 16px; cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .mv-crumb:hover { border-color: var(--gold); color: var(--gold-dim); }

    .pv-link { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-inset); padding: .6rem .75rem; margin-bottom: .8rem; }
    .pv-link-label { font-family: var(--font-heading); font-size: .58rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
    .pv-link-main { font-size: .85rem; font-weight: 700; color: var(--text); margin: .15rem 0; }
    .pv-link-desc { font-size: .78rem; color: var(--text-mid); line-height: 1.5; margin-bottom: .3rem; }
    .pv-link a { font-size: .74rem; color: var(--gold-dim); }

    .mv-name-input { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--gold-dim);
      padding: 3px 8px; border-radius: 6px; border: 1px solid var(--gold); background: var(--bg-inset); width: min(360px, 100%); }
    .mv-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; align-items: center; }
    .mv-chip { font-family: var(--font-heading); font-size: .62rem; font-weight: 600; letter-spacing: .06em;
      padding: 4px 11px; border-radius: 16px; cursor: pointer; background: rgba(255,248,245,.92);
      border: 2px solid var(--c); color: var(--text-mid); transition: opacity .15s, background .15s; }
    .mv-chip:hover { background: var(--bg-inset); }
    .mv-chip.off { opacity: .4; border-style: dashed; text-decoration: line-through; }
    .mv-chip span { color: var(--text-dim); margin-left: .25rem; }
    #pin-search { width: 100%; font-family: var(--font-body); font-size: .82rem; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); margin-bottom: .7rem; }

    .pin-row { display: flex; align-items: center; gap: .55rem; padding: 6px 8px; border-radius: 6px; cursor: pointer;
               border: 1px solid transparent; font-size: .82rem; color: var(--text); }
    .pin-row:hover { background: var(--bg-inset); border-color: var(--border); }
    .pin-row-icon { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); background: #fffaf5;
                    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .pin-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: .3rem; }
    .pv-type { display: inline-block; font-family: var(--font-heading); font-size: .6rem; font-weight: 700; letter-spacing: .08em;
               text-transform: uppercase; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--c); color: var(--text-mid); margin-bottom: .7rem; }
    .pv-desc { font-size: .85rem; color: var(--text-mid); line-height: 1.55; white-space: pre-wrap; margin-bottom: 1rem; }
    .pv-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

    @media (max-width: 800px) {
      .mv-body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
      .mv-side { overflow: visible; }
    }
  </style>
</head>
<body>
<div class="page-texture"></div>

<a class="back-btn" id="back-btn" href="../index.html">← Homepage</a>

<!-- ═════════ Map list ═════════ -->
<div id="view-list">
  <div class="mp-wrap">
    <header class="mp-header">
      <span class="mp-ornament">✦ ── ✦ ── ✦</span>
      <h1 class="mp-title">Map Pinboard</h1>
      <p class="mp-sub">Pin the places of your world onto its maps</p>
    </header>

    <section class="panel">
      <div class="panel-title">New Map</div>
      <div class="mp-form-row">
        <div class="mp-form-field" style="flex:2"><label for="new-name">Name</label>
          <input type="text" id="new-name" placeholder="Continent of Aldra" maxlength="120"></div>
        <div class="mp-form-field" style="flex:2"><label for="new-file">Map image</label>
          <input type="file" id="new-file" accept="image/png,image/jpeg,image/webp"></div>
      </div>
      <button class="mp-btn mp-btn-primary" id="create-btn" onclick="createMap()">Create Map</button>
      <span class="mp-hint" style="margin-left:.6rem">PNG, JPEG or WebP, up to 25 MB</span>
      <div class="mp-status" id="create-status"></div>
    </section>

    <section class="panel">
      <div class="panel-title">Your Maps</div>
      <div id="map-list"><div class="mp-empty">Loading…</div></div>
    </section>
  </div>
</div>

<!-- ═════════ Single map ═════════ -->
<div id="view-map" hidden>
  <div class="mp-wrap">
    <div class="mv-toolbar">
      <div class="mv-crumbs" id="mv-crumbs"></div>
      <div class="mv-name" id="mv-name"></div>
      <button class="mp-btn" id="rename-btn" onclick="startRename()">Rename</button>
      <button class="mp-btn" id="replace-btn" onclick="$('replace-file').click()" title="Swap in a new image for this map; pins keep their relative positions">Replace image</button>
      <input type="file" id="replace-file" accept="image/png,image/jpeg,image/webp" hidden onchange="replaceImage(this)">
      <button class="mp-btn" id="add-pin-btn" onclick="toggleAddMode()">+ Add Pin</button>
    </div>
    <div class="mv-filters" id="mv-filters" hidden></div>
    <div class="mv-body">
      <div class="mv-mapbox">
        <div id="map"></div>
        <div class="mv-banner" id="mv-banner" hidden>Click the map to place the pin · Esc to cancel</div>
      </div>
      <aside class="panel mv-side" id="side-panel"></aside>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/supabase-client.js?v=1"></script>
<script src="js/auth.js?v=1"></script>
<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const BUCKET = 'maps';
const MAX_BYTES = 25 * 1024 * 1024;
const EXT_FOR_TYPE = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };

const PIN_TYPES = {
  city:     { label: 'City',     glyph: '🏰', color: '#b8283a' },
  town:     { label: 'Town',     glyph: '🏘️', color: '#d4a017' },
  village:  { label: 'Village',  glyph: '🏠', color: '#8b5a2b' },
  dungeon:  { label: 'Dungeon',  glyph: '💀', color: '#4a3570' },
  landmark: { label: 'Landmark', glyph: '⭐', color: '#2f8f9e' },
  ruin:     { label: 'Ruin',     glyph: '🏚️', color: '#7a7a7a' },
  region:   { label: 'Region',   glyph: '🗺️', color: '#4a9b5e' },
  port:     { label: 'Port',     glyph: '⚓', color: '#3a6ea5' },
  other:    { label: 'Other',    glyph: '📍', color: '#6b4f9a' },
};

// ─── State ───────────────────────────────────────────────────────────────────
let currentUser = null;
let maps = [];
let currentMap = null;        // the map row being viewed
let pins = [];                // pin rows for currentMap
let lmap = null;              // Leaflet map instance
let markers = new Map();      // pin id -> L.Marker
let selectedId = null;
let addMode = false;
let formState = null;         // { mode:'new'|'edit', pin?, x, y, type, draftMarker? }
let routeToken = 0;
let hiddenTypes = new Set();  // pin types toggled off in the filter bar
let pinSearch = '';           // text in the side-panel search box
let renaming = false;
let mapsLoaded = false;       // `maps` has been fetched at least once (the child-map picker needs the full list)
let tlAges = [], tlEvents = [], tlError = null;   // timeline data for the event picker
let childLinks = [];          // [{ map_id, child_map_id }] across all maps, for breadcrumbs

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function setStatus(el, msg, isErr) { el.textContent = msg || ''; el.classList.toggle('err', !!isErr); }
function typeOf(t) { return PIN_TYPES[t] || PIN_TYPES.other; }

// Pin position is stored as a fraction (0..1) of the image, origin top-left.
// Leaflet's CRS.Simple has y growing upward, so flip y when converting.
const toLatLng = p => [(1 - p.y) * currentMap.image_height, p.x * currentMap.image_width];
const toFrac   = ll => ({ x: ll.lng / currentMap.image_width, y: 1 - ll.lat / currentMap.image_height });
const clamp01  = n => Math.min(1, Math.max(0, n));

async function signedUrl(path) {
  const { data, error } = await supabase.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

// ─── Routing (#map=<id>) ─────────────────────────────────────────────────────
// Hash forms:  (empty) = map list,  #map=<id>  or  #map=<id>&pin=<pinId> (opens the map focused on that pin)
async function route() {
  const token = ++routeToken;
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const id = params.get('map');
  const pin = params.get('pin');
  const uuid = /^[0-9a-f-]{36}$/i;
  if (id && uuid.test(id)) await openMap(id, token, pin && uuid.test(pin) ? pin : null);
  else showList();
}
window.addEventListener('hashchange', route);

// ─── Map list ────────────────────────────────────────────────────────────────
async function loadMaps() {
  const { data, error } = await supabase.from('maps').select('*').order('created_at', { ascending: false });
  if (error) {
    maps = [];
    $('map-list').innerHTML = '<div class="mp-empty" style="color:#a33">Could not load maps: ' + esc(error.message) +
      '<br>Have you run <code>map-pinboard/schema.sql</code> in Supabase?</div>';
    return false;
  }
  maps = data || [];
  mapsLoaded = true;
  return true;
}

async function ensureMapsLoaded() { if (!mapsLoaded) await loadMaps(); }

// Timeline Ages + Events feed the "Timeline event" picker. Failure is non-fatal (the picker says so).
async function loadTimeline() {
  const [a, e] = await Promise.all([supabase.from('timeline_ages').select('*'), supabase.from('timeline_events').select('*')]);
  const err = a.error || e.error;
  tlError = err ? err.message : null;
  tlAges = a.data || [];
  tlEvents = e.data || [];
}

// Same display rule as the timeline page: "<n> <ABBR>" relative to the Age if it has an abbreviation, else "Year <n>".
function eventYearLabel(ev) {
  const age = tlAges.find(a => a.id === ev.age_id);
  return age && age.abbreviation ? (ev.year - age.start_year) + ' ' + age.abbreviation : 'Year ' + ev.year;
}
function eventLabel(ev) { return ev.title + ' — ' + eventYearLabel(ev); }

function thumbPath(m) { return m.user_id + '/' + m.id + '/thumb.jpg'; }

async function renderMapList() {
  const el = $('map-list');
  if (!maps.length) { el.innerHTML = '<div class="mp-empty">No maps yet. Upload one above to get started.</div>'; return; }
  el.innerHTML = '<div class="mp-grid">' + maps.map(m =>
    '<div class="mp-card">' +
      '<div class="mp-card-thumb" id="thumb-' + m.id + '" onclick="location.hash=\'#map=' + m.id + '\'">🗺</div>' +
      '<div class="mp-card-body">' +
        '<div class="mp-card-name" title="' + esc(m.name) + '" onclick="location.hash=\'#map=' + m.id + '\'">' + esc(m.name) + '</div>' +
        '<div class="mp-card-sub">' + m.image_width + ' × ' + m.image_height + ' px</div>' +
        '<div class="mp-card-actions">' +
          '<button class="mp-btn mp-btn-primary" onclick="location.hash=\'#map=' + m.id + '\'">Open</button>' +
          '<button class="mp-btn mp-btn-danger" onclick="deleteMap(\'' + m.id + '\')">Delete</button>' +
        '</div>' +
      '</div>' +
    '</div>').join('') + '</div>';

  // Fill thumbnails (best effort; a missing thumb just keeps the placeholder).
  const { data } = await supabase.storage.from(BUCKET).createSignedUrls(maps.map(thumbPath), 3600);
  (data || []).forEach((row, i) => {
    if (!row || row.error || !row.signedUrl) return;
    const t = $('thumb-' + maps[i].id);
    if (t) { t.style.backgroundImage = 'url("' + row.signedUrl + '")'; t.textContent = ''; }
  });
}

function showList() {
  destroyMapView();
  $('view-map').hidden = true;
  $('view-list').hidden = false;
  $('back-btn').hidden = false;
  document.title = 'Map Pinboard';
  loadMaps().then(ok => { if (ok) renderMapList(); });
}

// ─── Create map ──────────────────────────────────────────────────────────────
function readImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url, width: img.naturalWidth, height: img.naturalHeight });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file could not be read as an image.')); };
    img.src = url;
  });
}

function makeThumb(img, maxSide) {
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.82));
}

async function createMap() {
  const status = $('create-status');
  const btn = $('create-btn');
  const name = $('new-name').value.trim();
  const file = $('new-file').files[0];
  if (!name) return setStatus(status, 'Give the map a name.', true);
  if (!file) return setStatus(status, 'Choose an image file.', true);
  const ext = EXT_FOR_TYPE[file.type];
  if (!ext) return setStatus(status, 'Only PNG, JPEG or WebP images are supported.', true);
  if (file.size > MAX_BYTES) return setStatus(status, 'That file is over 25 MB. Try a smaller or compressed version.', true);

  btn.disabled = true;
  const uploaded = [];
  let imgInfo = null;
  try {
    setStatus(status, 'Reading image…');
    imgInfo = await readImage(file);

    const id = crypto.randomUUID();
    const basePath = currentUser.id + '/' + id + '/base.' + ext;
    const tPath = currentUser.id + '/' + id + '/thumb.jpg';

    setStatus(status, 'Uploading…');
    const up = await supabase.storage.from(BUCKET).upload(basePath, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    uploaded.push(basePath);

    try {   // thumbnail is a nicety; never fail the whole upload for it
      const thumb = await makeThumb(imgInfo.img, 480);
      if (thumb) {
        const tu = await supabase.storage.from(BUCKET).upload(tPath, thumb, { contentType: 'image/jpeg', upsert: false });
        if (!tu.error) uploaded.push(tPath);
      }
    } catch (e) { console.warn('thumbnail skipped', e); }

    setStatus(status, 'Saving…');
    const { data, error } = await supabase.from('maps').insert({
      id, user_id: currentUser.id, name,
      image_path: basePath, image_width: imgInfo.width, image_height: imgInfo.height,
    }).select().single();
    if (error) throw error;

    $('new-name').value = ''; $('new-file').value = '';
    setStatus(status, '');
    location.hash = '#map=' + data.id;
  } catch (e) {
    if (uploaded.length) await supabase.storage.from(BUCKET).remove(uploaded);   // don't leave orphans
    setStatus(status, 'Could not create map: ' + (e.message || e), true);
  } finally {
    if (imgInfo) URL.revokeObjectURL(imgInfo.url);
    btn.disabled = false;
  }
}

async function deleteMap(id) {
  const m = maps.find(x => x.id === id);
  if (!m) return;
  if (!confirm('Delete "' + m.name + '" and all of its pins? This cannot be undone.')) return;
  const { error } = await supabase.from('maps').delete().eq('id', id);   // pins cascade
  if (error) { alert('Could not delete: ' + error.message); return; }
  // DB cascade does not touch Storage, so remove the files ourselves.
  const paths = [m.image_path, m.grid_image_path, thumbPath(m)].filter(Boolean);
  const rm = await supabase.storage.from(BUCKET).remove(paths);
  if (rm.error) console.warn('Map deleted, but files could not be removed:', rm.error);
  maps = maps.filter(x => x.id !== id);
  renderMapList();
}

// ─── Map view ────────────────────────────────────────────────────────────────
function destroyMapView() {
  if (lmap) { lmap.remove(); lmap = null; }
  markers.clear();
  currentMap = null; pins = []; selectedId = null; formState = null; addMode = false;
  hiddenTypes = new Set(); pinSearch = ''; renaming = false;
  $('mv-filters').hidden = true; $('add-pin-btn').disabled = false;
}

async function openMap(id, token, focusPinId) {
  destroyMapView();
  $('view-list').hidden = true;
  $('view-map').hidden = false;
  $('back-btn').hidden = true;
  $('side-panel').innerHTML = '<div class="mp-empty">Loading map…</div>';

  let row = maps.find(m => m.id === id);
  if (!row) {
    const { data, error } = await supabase.from('maps').select('*').eq('id', id).maybeSingle();
    if (token !== routeToken) return;
    if (error || !data) { alert('That map could not be found.'); location.hash = ''; return; }
    row = data;
  }
  currentMap = row;
  $('mv-name').textContent = row.name;
  document.title = row.name + ' · Map Pinboard';

  let url;
  try { url = await signedUrl(row.image_path); }
  catch (e) {
    if (token !== routeToken) return;
    $('side-panel').innerHTML = '<div class="mp-empty" style="color:#a33">Could not load the map image: ' + esc(e.message || e) + '</div>';
    return;
  }
  const [pinsRes, childRes] = await Promise.all([
    supabase.from('map_pins').select('*').eq('map_id', id).order('created_at', { ascending: true }),
    supabase.from('map_pins').select('map_id, child_map_id').not('child_map_id', 'is', null),   // for breadcrumbs
    loadTimeline(),
    ensureMapsLoaded(),
  ]);
  if (token !== routeToken) return;    // user navigated away while we were loading
  pins = pinsRes.data || [];
  childLinks = childRes.data || [];
  renderCrumbs();

  const W = row.image_width, H = row.image_height;
  const bounds = [[0, 0], [H, W]];
  lmap = L.map('map', { crs: L.CRS.Simple, minZoom: -6, maxZoom: 3, zoomSnap: 0.25, zoomDelta: 0.5,
                        attributionControl: false, maxBoundsViscosity: 0.7 });
  L.imageOverlay(url, bounds).addTo(lmap);
  lmap.fitBounds(bounds, { animate: false });
  lmap.setMinZoom(lmap.getZoom() - 1);
  lmap.setMaxBounds(L.latLngBounds(bounds).pad(0.3));

  lmap.on('click', onMapClick);
  pins.forEach(addMarker);
  renderPanel();
  if (focusPinId && pins.some(p => p.id === focusPinId)) focusPin(focusPinId);   // deep link from the timeline page
  if (pinsRes.error) $('side-panel').insertAdjacentHTML('afterbegin', '<div class="mp-status err">Could not load pins: ' + esc(pinsRes.error.message) + '</div>');
}

// ─── Breadcrumbs (ancestor maps reached via a pin's "opens map" link) ────────
function renderCrumbs() {
  const parentOf = {};
  childLinks.forEach(l => { if (l.map_id !== l.child_map_id && !(l.child_map_id in parentOf)) parentOf[l.child_map_id] = l.map_id; });
  const chain = [];
  const seen = new Set([currentMap.id]);
  for (let cur = parentOf[currentMap.id]; cur && !seen.has(cur) && chain.length < 12; cur = parentOf[cur]) { seen.add(cur); chain.unshift(cur); }
  $('mv-crumbs').innerHTML =
    '<button class="mp-btn" onclick="location.hash=\'\'">← All maps</button>' +
    chain.map(id => { const m = maps.find(x => x.id === id);
      return '<span class="mv-crumb-sep">›</span><button class="mv-crumb" onclick="location.hash=\'#map=' + id + '\'">' + esc(m ? m.name : 'Map') + '</button>'; }).join('') +
    (chain.length ? '<span class="mv-crumb-sep">›</span>' : '');
}

// ─── Markers ─────────────────────────────────────────────────────────────────
function pinIcon(type, opts) {
  opts = opts || {};
  const t = typeOf(type);
  return L.divIcon({
    className: 'pin-wrap',
    html: '<div class="pin' + (opts.selected ? ' selected' : '') + (opts.draft ? ' draft' : '') + '" style="--c:' + t.color + '">' + t.glyph +
          (opts.child ? '<span class="pin-badge" title="Opens another map">↳</span>' : '') + '</div>',
    iconSize: [30, 30], iconAnchor: [15, 15],
  });
}

function addMarker(pin) {
  const mk = L.marker(toLatLng(pin), { icon: pinIcon(pin.pin_type, { selected: pin.id === selectedId, child: !!pin.child_map_id }), draggable: false, keyboard: false })
    .addTo(lmap)
    .bindTooltip(esc(pin.title), { direction: 'top', offset: [0, -16] });
  mk.on('click', () => selectPin(pin.id));
  mk.on('dragend', () => onDragEnd(pin.id, mk));
  markers.set(pin.id, mk);
  return mk;
}

function refreshMarker(pin) {
  const mk = markers.get(pin.id);
  if (!mk) return;
  mk.setIcon(pinIcon(pin.pin_type, { selected: pin.id === selectedId, child: !!pin.child_map_id }));
  mk.setLatLng(toLatLng(pin));
  mk.setTooltipContent(esc(pin.title));
  mk.setZIndexOffset(pin.id === selectedId ? 1000 : 0);
}

function selectPin(id) {
  if (formState) return;                       // finish or cancel the open form first
  const prev = pins.find(p => p.id === selectedId);
  if (prev && markers.get(prev.id)) markers.get(prev.id).dragging.disable();
  selectedId = id;
  if (prev) refreshMarker(prev);
  const cur = pins.find(p => p.id === id);
  if (cur) { refreshMarker(cur); markers.get(cur.id).dragging.enable(); }
  renderPanel();
}

async function onDragEnd(id, mk) {
  const pin = pins.find(p => p.id === id);
  if (!pin) return;
  const f = toFrac(mk.getLatLng());
  const x = clamp01(f.x), y = clamp01(f.y);
  if (formState && formState.mode === 'edit' && formState.pin.id === id) {   // just move the form's coordinates
    formState.x = x; formState.y = y; updateCoordsHint(); return;
  }
  const { error } = await supabase.from('map_pins').update({ x, y }).eq('id', id);
  if (error) { mk.setLatLng(toLatLng(pin)); alert('Could not move pin: ' + error.message); return; }
  pin.x = x; pin.y = y;
  refreshMarker(pin);
}

// ─── Add / edit pin ──────────────────────────────────────────────────────────
function setAddMode(on) {
  addMode = on;
  $('add-pin-btn').classList.toggle('mp-btn-active', on);
  $('mv-banner').hidden = !on;
  $('map').classList.toggle('adding', on);
}

function toggleAddMode() {
  if (!lmap || formState) return;
  if (!addMode) selectPin(null);
  setAddMode(!addMode);
}

function onMapClick(e) {
  if (addMode) {
    const f = toFrac(e.latlng);
    if (f.x < 0 || f.x > 1 || f.y < 0 || f.y > 1) return;       // clicked outside the image
    setAddMode(false);
    beginForm('new', { x: f.x, y: f.y });
  } else if (!formState && selectedId) {
    selectPin(null);
  }
}

function beginForm(mode, data) {
  if (mode === 'new') {
    const mk = L.marker(toLatLng(data), { icon: pinIcon('landmark', { draft: true }), draggable: true, keyboard: false, zIndexOffset: 2000 }).addTo(lmap);
    mk.on('dragend', () => {
      const f = toFrac(mk.getLatLng());
      formState.x = clamp01(f.x); formState.y = clamp01(f.y);
      updateCoordsHint();
    });
    formState = { mode, x: data.x, y: data.y, type: 'landmark', draftMarker: mk };
  } else {
    const pin = data;
    formState = { mode, pin, x: pin.x, y: pin.y, type: pin.pin_type };
  }
  $('add-pin-btn').disabled = true;
  renderPanel();
  const t = $('pf-title'); if (t) t.focus();
}

function endForm() {
  if (formState && formState.draftMarker) formState.draftMarker.remove();
  formState = null;
  $('add-pin-btn').disabled = false;
}

function cancelForm() {
  if (!formState) return;
  if (formState.mode === 'edit') refreshMarker(formState.pin);   // snap back to saved position/icon
  endForm();
  renderPanel();
}

function onFormTypeChange(type) {
  formState.type = type;
  if (formState.mode === 'new') formState.draftMarker.setIcon(pinIcon(type, { draft: true }));
  else markers.get(formState.pin.id).setIcon(pinIcon(type, { selected: true, child: !!formState.pin.child_map_id }));
}

function updateCoordsHint() {
  const el = $('pf-coords');
  if (el && formState) el.textContent = 'Position: ' + (formState.x * 100).toFixed(1) + '% across, ' + (formState.y * 100).toFixed(1) + '% down · drag the marker to adjust';
}

async function savePin() {
  const status = $('pf-status');
  const title = $('pf-title').value.trim();
  const description = $('pf-desc').value.trim();
  const pin_type = $('pf-type').value;
  const timeline_event_id = $('pf-event').value || null;
  const child_map_id = $('pf-child').value || null;
  if (!title) return setStatus(status, 'A pin needs a title.', true);
  const btn = $('pf-save'); btn.disabled = true;
  try {
    if (formState.mode === 'new') {
      const { data, error } = await supabase.from('map_pins').insert({
        map_id: currentMap.id, user_id: currentUser.id,
        x: formState.x, y: formState.y, title, pin_type, description: description || null, timeline_event_id, child_map_id,
      }).select().single();
      if (error) throw error;
      pins.push(data);
      endForm();
      addMarker(data);
      selectedId = null;
      selectPin(data.id);
    } else {
      const pin = formState.pin;
      const patch = { x: formState.x, y: formState.y, title, pin_type, description: description || null, timeline_event_id, child_map_id };
      const { error } = await supabase.from('map_pins').update(patch).eq('id', pin.id);
      if (error) throw error;
      Object.assign(pin, patch);
      endForm();
      refreshMarker(pin);
      renderPanel();
    }
  } catch (e) {
    setStatus(status, 'Could not save: ' + (e.message || e), true);
    btn.disabled = false;
  }
}

async function deletePin(id) {
  const pin = pins.find(p => p.id === id);
  if (!pin || !confirm('Delete the pin "' + pin.title + '"?')) return;
  const { error } = await supabase.from('map_pins').delete().eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  const mk = markers.get(id); if (mk) mk.remove();
  markers.delete(id);
  pins = pins.filter(p => p.id !== id);
  if (formState) endForm();
  selectedId = null;
  renderPanel();
}

function focusPin(id) {
  const pin = pins.find(p => p.id === id);
  if (!pin || !lmap) return;
  lmap.setView(toLatLng(pin), Math.max(lmap.getZoom(), lmap.getMinZoom() + 1), { animate: true });
  selectPin(id);
}

// ─── Side panel ──────────────────────────────────────────────────────────────
function renderPanel() {
  const el = $('side-panel');
  const pin = pins.find(p => p.id === selectedId);
  if (formState) { el.innerHTML = formHtml(); updateCoordsHint(); }
  else if (pin) el.innerHTML = pinHtml(pin);
  else el.innerHTML = listHtml();
  renderFilters();
  applyFilters();
}

// Pins that pass the type filter and the search box (used by the side-panel list).
function listedPins() {
  const q = pinSearch.trim().toLowerCase();
  return pins
    .filter(p => !hiddenTypes.has(p.pin_type))
    .filter(p => !q || p.title.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q))
    .sort((a, b) => a.title.localeCompare(b.title));
}

function pinRowsHtml() {
  const list = listedPins();
  if (list.length) {
    return list.map(p => { const t = typeOf(p.pin_type);
      return '<div class="pin-row" onclick="focusPin(\'' + p.id + '\')" style="--c:' + t.color + '">' +
        '<span class="pin-row-icon">' + t.glyph + '</span><span class="pin-row-title">' + esc(p.title) + '</span></div>'; }).join('');
  }
  return pins.length
    ? '<div class="mp-empty">No pins match.</div>'
    : '<div class="mp-empty">No pins yet. Press <b>+ Add Pin</b>, then click the map.</div>';
}

function pinCountText() {
  const shown = listedPins().length;
  return shown === pins.length ? String(pins.length) : shown + ' of ' + pins.length;
}

function listHtml() {
  return '<div class="panel-title">Pins (<span id="pin-count">' + pinCountText() + '</span>)</div>' +
    (pins.length ? '<input type="search" id="pin-search" placeholder="Search pins…" value="' + esc(pinSearch) + '" oninput="onPinSearch(this.value)">' : '') +
    '<div id="pin-rows">' + pinRowsHtml() + '</div>' +
    '<div class="mp-hint" style="margin-top:1rem">Scroll to zoom, drag to pan. Click a pin to select it; a selected pin can be dragged to a new spot. ' +
    'The type chips above the map hide pins from both the map and this list.</div>';
}

function onPinSearch(v) {
  pinSearch = v;
  $('pin-rows').innerHTML = pinRowsHtml();     // only the rows, so the search box keeps focus
  $('pin-count').textContent = pinCountText();
}

// ─── Type filter chips ───────────────────────────────────────────────────────
function renderFilters() {
  const el = $('mv-filters');
  const counts = {};
  pins.forEach(p => { counts[p.pin_type] = (counts[p.pin_type] || 0) + 1; });
  hiddenTypes.forEach(t => { if (!counts[t]) hiddenTypes.delete(t); });   // type no longer used by any pin
  const types = Object.keys(PIN_TYPES).filter(t => counts[t]);
  if (types.length < 2 && !hiddenTypes.size) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = types.map(t => { const d = PIN_TYPES[t];
      return '<button class="mv-chip' + (hiddenTypes.has(t) ? ' off' : '') + '" style="--c:' + d.color + '" onclick="toggleType(\'' + t + '\')">' +
        d.glyph + ' ' + d.label + '<span>' + counts[t] + '</span></button>'; }).join('') +
    (hiddenTypes.size ? '<button class="mp-btn" onclick="clearTypeFilter()">Show all</button>' : '');
}

function toggleType(t) {
  if (hiddenTypes.has(t)) hiddenTypes.delete(t); else hiddenTypes.add(t);
  renderPanel();
}
function clearTypeFilter() { hiddenTypes.clear(); renderPanel(); }

// Hide/show map markers. A pin you are selecting or editing always stays visible.
function applyFilters() {
  if (!lmap) return;
  pins.forEach(p => {
    const mk = markers.get(p.id);
    if (!mk) return;
    const keep = !hiddenTypes.has(p.pin_type) || p.id === selectedId || (formState && formState.pin && formState.pin.id === p.id);
    if (keep && !lmap.hasLayer(mk)) mk.addTo(lmap);
    else if (!keep && lmap.hasLayer(mk)) mk.remove();
  });
}

// ─── Rename map ──────────────────────────────────────────────────────────────
function startRename() {
  if (!currentMap || renaming) return;
  renaming = true;
  const el = $('mv-name');
  el.innerHTML = '<input class="mv-name-input" id="rename-input" maxlength="120" value="' + esc(currentMap.name) + '">';
  const inp = $('rename-input');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finishRename(inp.value); }
    else if (e.key === 'Escape') { e.stopPropagation(); finishRename(currentMap.name); }   // same name = no change
  });
  inp.addEventListener('blur', () => finishRename(inp.value));
}

async function finishRename(value) {
  if (!renaming) return;
  renaming = false;
  const name = value.trim();
  const el = $('mv-name');
  if (!name || name === currentMap.name) { el.textContent = currentMap.name; return; }
  const { error } = await supabase.from('maps').update({ name }).eq('id', currentMap.id);
  if (error) { alert('Could not rename: ' + error.message); el.textContent = currentMap.name; return; }
  currentMap.name = name;
  const m = maps.find(x => x.id === currentMap.id); if (m) m.name = name;
  el.textContent = name;
  document.title = name + ' · Map Pinboard';
}

// ─── Replace map image ───────────────────────────────────────────────────────
async function replaceImage(input) {
  const file = input.files[0];
  input.value = '';
  if (!file || !currentMap) return;
  const ext = EXT_FOR_TYPE[file.type];
  if (!ext) return alert('Only PNG, JPEG or WebP images are supported.');
  if (file.size > MAX_BYTES) return alert('That file is over 25 MB. Try a smaller or compressed version.');

  const btn = $('replace-btn');
  const label = btn.textContent;
  let info = null;
  const uploaded = [];
  try {
    info = await readImage(file);
    const oldRatio = currentMap.image_width / currentMap.image_height;
    const newRatio = info.width / info.height;
    if (Math.abs(newRatio / oldRatio - 1) > 0.01 &&
        !confirm('The new image has a different shape (' + info.width + '×' + info.height + ' vs ' + currentMap.image_width + '×' + currentMap.image_height + ').\n\n' +
                 'Pins keep their relative position (% across / % down), so some may no longer sit on the places they mark. Replace anyway?')) return;

    btn.disabled = true; btn.textContent = 'Uploading…';
    // A fresh filename each time avoids stale CDN/browser caches of the old image.
    const newPath = currentUser.id + '/' + currentMap.id + '/base-' + Date.now() + '.' + ext;
    const up = await supabase.storage.from(BUCKET).upload(newPath, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    uploaded.push(newPath);

    const { error } = await supabase.from('maps').update({ image_path: newPath, image_width: info.width, image_height: info.height }).eq('id', currentMap.id);
    if (error) throw error;
    uploaded.length = 0;     // the DB now points at the new file, so never clean it up past this point

    const oldPath = currentMap.image_path;
    try {
      const thumb = await makeThumb(info.img, 480);
      if (thumb) await supabase.storage.from(BUCKET).upload(thumbPath(currentMap), thumb, { contentType: 'image/jpeg', upsert: true, cacheControl: '60' });
    } catch (e) { console.warn('thumbnail skipped', e); }
    if (oldPath && oldPath !== newPath) await supabase.storage.from(BUCKET).remove([oldPath]);

    Object.assign(currentMap, { image_path: newPath, image_width: info.width, image_height: info.height });
    const m = maps.find(x => x.id === currentMap.id); if (m) Object.assign(m, currentMap);
    await openMap(currentMap.id, ++routeToken);      // rebuild the view with the new image
  } catch (e) {
    if (uploaded.length) await supabase.storage.from(BUCKET).remove(uploaded);
    alert('Could not replace the image: ' + (e.message || e));
  } finally {
    if (info) URL.revokeObjectURL(info.url);
    btn.disabled = false; btn.textContent = label;
  }
}

function eventLinkHtml(pin) {
  if (!pin.timeline_event_id) return '';
  const ev = tlEvents.find(e => e.id === pin.timeline_event_id);
  if (!ev) return '<div class="pv-link"><div class="pv-link-label">Timeline event</div><div class="mp-hint">' +
    (tlError ? 'Timeline could not be loaded.' : 'Linked event not found.') + '</div></div>';
  const desc = (ev.description || '').trim();
  return '<div class="pv-link"><div class="pv-link-label">Timeline event</div>' +
    '<div class="pv-link-main">⧗ ' + esc(ev.title) + ' · ' + esc(eventYearLabel(ev)) + '</div>' +
    (desc ? '<div class="pv-link-desc">' + esc(desc.length > 220 ? desc.slice(0, 220) + '…' : desc) + '</div>' : '') +
    '<a href="../timeline/index.html#event=' + ev.id + '">View on timeline →</a></div>';
}

function childLinkHtml(pin) {
  if (!pin.child_map_id) return '';
  const m = maps.find(x => x.id === pin.child_map_id);
  return '<div class="pv-link"><div class="pv-link-label">Opens map</div>' +
    '<div class="pv-link-main">' + esc(m ? m.name : 'Map not found') + '</div>' +
    (m ? '<button class="mp-btn mp-btn-primary" onclick="location.hash=\'#map=' + m.id + '\'">Open map →</button>' : '') + '</div>';
}

// <option>s for the timeline-event picker, grouped by Age (same order as the timeline page).
function eventOptionsHtml(selectedId) {
  let html = '<option value="">— none —</option>';
  if (!tlEvents.length) return html;
  const byYear = (a, b) => a.year - b.year;
  const groups = tlAges.slice().sort((a, b) => a.start_year - b.start_year)
    .map(a => ({ label: a.name, evs: tlEvents.filter(e => e.age_id === a.id).sort(byYear) }));
  groups.push({ label: 'Unassigned', evs: tlEvents.filter(e => !tlAges.some(a => a.id === e.age_id)).sort(byYear) });
  groups.filter(g => g.evs.length).forEach(g => {
    html += '<optgroup label="' + esc(g.label) + '">' +
      g.evs.map(e => '<option value="' + e.id + '"' + (e.id === selectedId ? ' selected' : '') + '>' + esc(eventLabel(e)) + '</option>').join('') + '</optgroup>';
  });
  return html;
}

function childOptionsHtml(selectedId) {
  return '<option value="">— none —</option>' +
    maps.filter(m => m.id !== currentMap.id).sort((a, b) => a.name.localeCompare(b.name))
      .map(m => '<option value="' + m.id + '"' + (m.id === selectedId ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('');
}

function pinHtml(pin) {
  const t = typeOf(pin.pin_type);
  return '<div class="pv-title">' + esc(pin.title) + '</div>' +
    '<div class="pv-type" style="--c:' + t.color + '">' + t.glyph + ' ' + t.label + '</div>' +
    (pin.description ? '<div class="pv-desc">' + esc(pin.description) + '</div>' : '<div class="mp-hint" style="margin-bottom:1rem">No description yet.</div>') +
    eventLinkHtml(pin) + childLinkHtml(pin) +
    '<div class="pv-actions">' +
      '<button class="mp-btn mp-btn-primary" onclick="beginForm(\'edit\', pins.find(p => p.id === selectedId))">Edit</button>' +
      '<button class="mp-btn" onclick="selectPin(null)">Close</button>' +
      '<button class="mp-btn mp-btn-danger" onclick="deletePin(\'' + pin.id + '\')">Delete</button>' +
    '</div>' +
    '<div class="mp-hint" style="margin-top:1rem">Drag this pin on the map to move it.</div>';
}

function formHtml() {
  const isNew = formState.mode === 'new';
  const pin = formState.pin || {};
  return '<div class="panel-title">' + (isNew ? 'New Pin' : 'Edit Pin') + '</div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-title">Title</label>' +
      '<input type="text" id="pf-title" maxlength="120" value="' + esc(pin.title || '') + '" onkeydown="if(event.key===\'Enter\')savePin()"></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-type">Type</label>' +
      '<select id="pf-type" onchange="onFormTypeChange(this.value)">' +
      Object.entries(PIN_TYPES).map(([k, t]) => '<option value="' + k + '"' + (k === formState.type ? ' selected' : '') + '>' + t.glyph + ' ' + t.label + '</option>').join('') +
      '</select></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-desc">Description</label>' +
      '<textarea id="pf-desc">' + esc(pin.description || '') + '</textarea></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-event">Timeline event (optional)</label>' +
      '<select id="pf-event">' + eventOptionsHtml(pin.timeline_event_id) + '</select>' +
      (tlError ? '<span class="mp-hint">Timeline could not be loaded: ' + esc(tlError) + '</span>'
        : !tlEvents.length ? '<span class="mp-hint">No timeline events yet — add some in the Timeline Builder.</span>' : '') + '</div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-child">Opens map (optional)</label>' +
      '<select id="pf-child">' + childOptionsHtml(pin.child_map_id) + '</select>' +
      (maps.length < 2 ? '<span class="mp-hint">Create another map to link a pin to it (e.g. a city map).</span>' : '') + '</div></div>' +
    '<div class="mp-hint" id="pf-coords" style="margin-bottom:.8rem"></div>' +
    '<div class="pv-actions">' +
      '<button class="mp-btn mp-btn-primary" id="pf-save" onclick="savePin()">' + (isNew ? 'Add Pin' : 'Save') + '</button>' +
      '<button class="mp-btn" onclick="cancelForm()">Cancel</button>' +
      (isNew ? '' : '<button class="mp-btn mp-btn-danger" onclick="deletePin(\'' + pin.id + '\')">Delete</button>') +
    '</div><div class="mp-status" id="pf-status"></div>';
}

// ─── Keyboard ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (addMode) setAddMode(false);
  else if (formState) cancelForm();
  else if (selectedId) selectPin(null);
});

// ─── Init ────────────────────────────────────────────────────────────────────
async function boot(user) {
  currentUser = user;
  await route();
}
(async function init() {
  boot(await requireAuth());
})();
</script>
</body>
</html>
