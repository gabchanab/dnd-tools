<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Pinboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../character builder/static/css/sheet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    [hidden] { display: none !important; }
    body { padding: 3rem 1.2rem 2rem; }

    .back-btn{position:fixed;top:1.2rem;left:1.2rem;z-index:1000;
      font-family:var(--font-heading);font-size:.60rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      padding:.45rem 1.1rem;background:rgba(255,250,248,.90);border:1px solid var(--border);
      border-radius:20px;color:var(--text-dim);text-decoration:none;transition:all .2s;
      backdrop-filter:blur(6px)}
    .back-btn:hover{border-color:var(--gold);color:var(--gold-dim);box-shadow:0 0 12px var(--gold-glow)}

    .mp-wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }
    .mp-header { text-align: center; margin-bottom: 2rem; }
    .mp-ornament { font-size: 1.4rem; color: var(--gold); opacity: .55; letter-spacing: .5em; display: block; margin-bottom: .8rem; }
    .mp-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--gold);
                letter-spacing: .1em; text-shadow: 0 0 32px var(--gold-glow), 0 0 8px rgba(185,155,80,.2); margin: 0 0 .4rem; }
    .mp-sub { font-size: .82rem; color: var(--text-dim); font-style: italic; font-family: var(--font-body); }

    .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
             padding: 1.4rem 1.3rem; margin-bottom: 1.5rem; }
    .panel-title { font-family: var(--font-heading); font-size: .75rem; font-weight: 700; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--gold-dim); margin: 0 0 1rem; }

    /* ── Forms / buttons (same look as the timeline tool) ── */
    .mp-form-row { display: flex; gap: .6rem; margin-bottom: .7rem; flex-wrap: wrap; }
    .mp-form-field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 140px; }
    .mp-form-field label { font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); font-family: var(--font-heading); }
    .mp-form-field input, .mp-form-field select, .mp-form-field textarea {
      font-family: var(--font-body); font-size: .82rem; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); width: 100%; }
    .mp-form-field textarea { min-height: 90px; resize: vertical; }
    .mp-btn { font-family: var(--font-heading); font-size: .68rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 7px 16px; border-radius: 16px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-mid); color: var(--gold-dim); }
    .mp-btn:hover:not(:disabled) { border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
    .mp-btn:disabled { opacity: .5; cursor: default; }
    .mp-btn-primary { background: var(--gold-glow); border-color: var(--gold); }
    .mp-btn-active { background: var(--gold-glow-md); border-color: var(--gold); }
    .mp-btn-danger:hover:not(:disabled) { border-color: #a33; color: #a33; box-shadow: none; }
    .mp-status { font-size: .78rem; margin-top: .6rem; color: var(--text-mid); }
    .mp-status.err { color: #a33; }
    .mp-hint { font-size: .68rem; color: var(--text-dim); font-style: italic; }
    .mp-empty { font-size: .8rem; color: var(--text-dim); font-style: italic; padding: 1rem 0; text-align: center; }

    /* ── Map list ── */
    .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .mp-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
               display: flex; flex-direction: column; transition: border-color .2s, box-shadow .2s, transform .15s; }
    .mp-card:hover { border-color: var(--gold); box-shadow: 0 0 18px var(--gold-glow), 0 4px 20px rgba(0,0,0,.12); transform: translateY(-2px); }
    .mp-card-thumb { height: 140px; background: var(--bg-warm) center / cover no-repeat; display: flex; align-items: center;
                     justify-content: center; font-size: 2rem; color: var(--gold); opacity: .9; cursor: pointer; }
    .mp-card-body { padding: .8rem .9rem .9rem; display: flex; flex-direction: column; gap: .35rem; }
    .mp-card-name { font-family: var(--font-heading); font-size: .95rem; font-weight: 700; color: var(--text); cursor: pointer;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-card-sub { font-size: .68rem; color: var(--text-dim); font-style: italic; }
    .mp-card-actions { display: flex; gap: .4rem; margin-top: .3rem; }

    /* ── Map view ── */
    /* The map view is a flex column (toolbar, year view, filters, then the map+panel filling what's left),
       so adding or hiding a row never needs a hard-coded height. */
    #view-map .mp-wrap { max-width: 1500px; display: flex; flex-direction: column; height: calc(100vh - 5rem); min-height: 560px; }
    #view-map .mp-wrap > * { flex: none; }
    .mv-toolbar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .mv-name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--gold-dim); letter-spacing: .06em; margin-right: auto; }
    #view-map .mp-wrap > .mv-body { flex: 1; min-height: 0; }
    .mv-body { display: grid; grid-template-columns: 1fr 330px; grid-template-rows: minmax(0, 1fr); gap: 1rem; }
    .mv-mapbox { position: relative; border: 1px solid var(--border-mid); border-radius: 10px; overflow: hidden; background: var(--bg-warm); }
    #map { position: absolute; inset: 0; background: var(--bg-warm); font-family: var(--font-body); }
    #map.adding, #map.adding .leaflet-interactive { cursor: crosshair; }
    .mv-banner { position: absolute; top: .7rem; left: 50%; transform: translateX(-50%); z-index: 800;
                 background: rgba(255,250,248,.94); border: 1px solid var(--gold); border-radius: 20px; padding: .35rem 1rem;
                 font-size: .75rem; color: var(--gold-dim); box-shadow: 0 0 12px var(--gold-glow); pointer-events: none; }
    .panel { resize: none; }
    .mv-side { overflow-y: auto; overflow-x: hidden; margin: 0; }

    .pin-wrap { background: none; border: none; }
    .pin { width: 30px; height: 30px; border-radius: 50%; background: #fffaf5; border: 3px solid var(--c, #6b4f9a);
           display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1;
           box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .12s; }
    .pin-wrap:hover .pin { transform: scale(1.12); }
    .pin.selected { transform: scale(1.25); box-shadow: 0 0 0 4px var(--gold-glow-md), 0 2px 8px rgba(0,0,0,.4); }
    .pin.draft { border-style: dashed; }
    .pin { position: relative; }
    .pin-badge { position: absolute; right: -7px; bottom: -7px; width: 17px; height: 17px; border-radius: 50%;
      background: var(--gold); color: #fff; border: 1.5px solid #fffaf5; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; }

    .mv-crumbs { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .mv-crumb-sep { color: var(--text-dim); font-size: .8rem; }
    .mv-crumb { font-family: var(--font-heading); font-size: .66rem; font-weight: 600; letter-spacing: .06em; padding: 5px 12px;
      border-radius: 16px; cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
    .mv-crumb:hover { border-color: var(--gold); color: var(--gold-dim); }

    .pv-link { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-inset); padding: .6rem .75rem; margin-bottom: .8rem; }
    .pv-link-label { font-family: var(--font-heading); font-size: .58rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
    .pv-link-main { font-size: .85rem; font-weight: 700; color: var(--text); margin: .15rem 0; }
    .pv-link-desc { font-size: .78rem; color: var(--text-mid); line-height: 1.5; margin-bottom: .3rem; }
    .pv-link a { font-size: .74rem; color: var(--gold-dim); }
    .pv-ev + .pv-ev { border-top: 1px dashed var(--border); margin-top: .55rem; padding-top: .5rem; }

    #pf-events, #pf-mevents, #ef-pins { display: flex; flex-direction: column; gap: .35rem; }
    .pf-ev { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .8rem; color: var(--text);
      padding: 4px 6px 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-inset); }
    .pf-ev-x { border: none; background: transparent; cursor: pointer; color: var(--text-dim); font-size: .8rem; padding: 2px 6px; border-radius: 4px; }
    .pf-ev-x:hover { background: rgba(180,50,50,.15); color: #a33; }

    .mv-name-input { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--gold-dim);
      padding: 3px 8px; border-radius: 6px; border: 1px solid var(--gold); background: var(--bg-inset); width: min(360px, 100%); }
    /* ── Year view ── */
    .mv-time { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .8rem; padding: .5rem .8rem;
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; }
    .mv-time.on { border-color: var(--gold); box-shadow: 0 0 12px var(--gold-glow); }
    .mv-time-label { font-family: var(--font-heading); font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-dim); }
    .mv-time select, .mv-time input { font-family: var(--font-body); font-size: .8rem; padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); }
    .mv-time input[type=number] { width: 6.5rem; }
    #tv-event { max-width: 280px; }
    .pin-row.dim { opacity: .45; }
    .pv-when { font-size: .8rem; color: var(--text-mid); margin: 0 0 .7rem; }
    .pv-state { display: block; width: fit-content; font-size: .72rem; padding: 2px 10px; border-radius: 12px; margin-bottom: .7rem; border: 1px solid var(--border-mid); color: var(--text-mid); }
    .pv-state.faded { background: rgba(138,144,176,.15); border-style: dashed; }
    .pv-state.ok { border-color: #4a9b5e; color: #2d7a3a; }
    .mp-form-field label.pf-check { display: flex; align-items: center; gap: .5rem; font-family: var(--font-body); font-size: .82rem;
      text-transform: none; letter-spacing: 0; color: var(--text); cursor: pointer; }
    .mp-form-field .pf-check input { width: auto; padding: 0; }

    /* Age + year picker used for pin and event dates */
    .yf { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .mp-form-field .yf select { flex: 1 1 130px; min-width: 0; width: auto; }
    .mp-form-field .yf input { flex: none; width: 5.5rem; }
    .pv-act { color: var(--gold-dim); cursor: pointer; text-decoration: underline; }

    /* ── Events key: a bubble in the corner of the map ── */
    .mv-key { position: absolute; top: .7rem; right: .7rem; z-index: 800; width: 250px; max-width: calc(100% - 1.4rem); max-height: 60%;
      display: flex; flex-direction: column; background: rgba(255,250,248,.95); border: 1px solid var(--border-mid);
      border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.2); backdrop-filter: blur(4px); font-family: var(--font-body); }
    .mv-key-head { display: flex; align-items: center; gap: .4rem; padding: .45rem .5rem .45rem .75rem; flex: none; }
    .mv-key-h { font-family: var(--font-heading); font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold-dim); margin-right: auto; cursor: pointer; user-select: none; }
    .mv-key-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-mid); background: transparent; color: var(--gold-dim);
      cursor: pointer; font-size: .95rem; line-height: 1; padding: 0; }
    .mv-key-btn:hover:not(:disabled) { border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
    .mv-key-btn:disabled { opacity: .4; cursor: default; }
    .mv-key-list { overflow-y: auto; padding: 0 .4rem .45rem; }
    .mv-key-row { padding: 5px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; border-left: 3px solid transparent;
      font-size: .78rem; color: var(--text); transition: opacity .15s; }
    .mv-key-row + .mv-key-row { margin-top: 2px; }
    .mv-key-row:hover { background: var(--bg-inset); border-color: var(--border); }
    .mv-key-row.in { border-left-color: var(--gold); background: var(--gold-glow); }
    .mv-key-row.in .mv-key-ttl { font-weight: 700; }
    .mv-key-row.out { opacity: .4; }
    .mv-key-row.sel { border-color: var(--gold); border-left-color: var(--gold); background: var(--gold-glow-md); opacity: 1; }
    .mv-key-ttl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mv-key-yrs { font-size: .68rem; color: var(--text-dim); }
    .mv-key-note { font-size: .7rem; color: var(--text-dim); font-style: italic; padding: .2rem .4rem .1rem; }

    .mv-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; align-items: center; }
    .mv-chip { font-family: var(--font-heading); font-size: .62rem; font-weight: 600; letter-spacing: .06em;
      padding: 4px 11px; border-radius: 16px; cursor: pointer; background: rgba(255,248,245,.92);
      border: 2px solid var(--c); color: var(--text-mid); transition: opacity .15s, background .15s; }
    .mv-chip:hover { background: var(--bg-inset); }
    .mv-chip.off { opacity: .4; border-style: dashed; text-decoration: line-through; }
    .mv-chip span { color: var(--text-dim); margin-left: .25rem; }
    #pin-search { width: 100%; font-family: var(--font-body); font-size: .82rem; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border-mid); background: var(--bg-inset); color: var(--text); margin-bottom: .7rem; }

    .pin-row { display: flex; align-items: center; gap: .55rem; padding: 6px 8px; border-radius: 6px; cursor: pointer;
               border: 1px solid transparent; font-size: .82rem; color: var(--text); }
    .pin-row:hover { background: var(--bg-inset); border-color: var(--border); }
    .pin-row-icon { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); background: #fffaf5;
                    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .pin-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: .3rem; }
    .pv-type { display: inline-block; font-family: var(--font-heading); font-size: .6rem; font-weight: 700; letter-spacing: .08em;
               text-transform: uppercase; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--c); color: var(--text-mid); margin-bottom: .7rem; }
    .pv-desc { font-size: .85rem; color: var(--text-mid); line-height: 1.55; white-space: pre-wrap; margin-bottom: 1rem; }
    .pv-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

    @media (max-width: 800px) {
      #view-map .mp-wrap { height: auto; min-height: 0; }
      #view-map .mp-wrap > .mv-body { flex: none; }
      .mv-body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
      .mv-side { overflow: visible; }
    }
  </style>
</head>
<body>
<div class="page-texture"></div>

<a class="back-btn" id="back-btn" href="../index.html">← Homepage</a>

<!-- ═════════ Map list ═════════ -->
<div id="view-list">
  <div class="mp-wrap">
    <header class="mp-header">
      <span class="mp-ornament">✦ ── ✦ ── ✦</span>
      <h1 class="mp-title">Map Pinboard</h1>
      <p class="mp-sub">Pin the places of your world onto its maps</p>
    </header>

    <section class="panel">
      <div class="panel-title">New Map</div>
      <div class="mp-form-row">
        <div class="mp-form-field" style="flex:2"><label for="new-name">Name</label>
          <input type="text" id="new-name" placeholder="Continent of Aldra" maxlength="120"></div>
        <div class="mp-form-field" style="flex:2"><label for="new-file">Map image</label>
          <input type="file" id="new-file" accept="image/png,image/jpeg,image/webp"></div>
      </div>
      <button class="mp-btn mp-btn-primary" id="create-btn" onclick="createMap()">Create Map</button>
      <span class="mp-hint" style="margin-left:.6rem">PNG, JPEG or WebP, up to 25 MB</span>
      <div class="mp-status" id="create-status"></div>
    </section>

    <section class="panel">
      <div class="panel-title">Your Maps</div>
      <div id="map-list"><div class="mp-empty">Loading…</div></div>
    </section>
  </div>
</div>

<!-- ═════════ Single map ═════════ -->
<div id="view-map" hidden>
  <div class="mp-wrap">
    <div class="mv-toolbar">
      <div class="mv-crumbs" id="mv-crumbs"></div>
      <div class="mv-name" id="mv-name"></div>
      <button class="mp-btn" id="rename-btn" onclick="startRename()">Rename</button>
      <button class="mp-btn" id="replace-btn" onclick="$('replace-file').click()" title="Swap in a new image for this map; pins keep their relative positions">Replace image</button>
      <input type="file" id="replace-file" accept="image/png,image/jpeg,image/webp" hidden onchange="replaceImage(this)">
      <button class="mp-btn" id="add-pin-btn" onclick="toggleAddMode()">+ Add Pin</button>
    </div>
    <div class="mv-time" id="mv-time"></div>
    <div class="mv-filters" id="mv-filters" hidden></div>
    <div class="mv-body">
      <div class="mv-mapbox">
        <div id="map"></div>
        <div class="mv-banner" id="mv-banner" hidden>Click the map to place the pin · Esc to cancel</div>
        <div class="mv-key" id="mv-key" hidden></div>
      </div>
      <aside class="panel mv-side" id="side-panel"></aside>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/supabase-client.js?v=1"></script>
<script src="js/auth.js?v=1"></script>
<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const BUCKET = 'maps';
const MAX_BYTES = 25 * 1024 * 1024;
const EXT_FOR_TYPE = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };

const PIN_TYPES = {
  city:     { label: 'City',     glyph: '🏰', color: '#b8283a' },
  town:     { label: 'Town',     glyph: '🏘️', color: '#d4a017' },
  village:  { label: 'Village',  glyph: '🏠', color: '#8b5a2b' },
  dungeon:  { label: 'Dungeon',  glyph: '💀', color: '#4a3570' },
  landmark: { label: 'Landmark', glyph: '⭐', color: '#2f8f9e' },
  ruin:     { label: 'Ruin',     glyph: '🏚️', color: '#7a7a7a' },
  region:   { label: 'Region',   glyph: '🗺️', color: '#4a9b5e' },
  port:     { label: 'Port',     glyph: '⚓', color: '#3a6ea5' },
  other:    { label: 'Other',    glyph: '📍', color: '#6b4f9a' },
};

// ─── State ───────────────────────────────────────────────────────────────────
let currentUser = null;
let maps = [];
let currentMap = null;        // the map row being viewed
let pins = [];                // pin rows for currentMap
let lmap = null;              // Leaflet map instance
let markers = new Map();      // pin id -> L.Marker
let selectedId = null;
let addMode = false;
let formState = null;         // { mode:'new'|'edit', pin?, x, y, type, draftMarker? }
let routeToken = 0;
let hiddenTypes = new Set();  // pin types toggled off in the filter bar
let pinSearch = '';           // text in the side-panel search box
let renaming = false;
let mapsLoaded = false;       // `maps` has been fetched at least once (the child-map picker needs the full list)
let tlAges = [], tlEvents = [], tlError = null;   // timeline data for the event picker
let linksError = null;        // error loading the pin <-> event links (e.g. migration not run yet)
let resizeObs = null;         // ResizeObserver keeping Leaflet's size in sync with its container
// Year view. Kept outside the per-map state on purpose: it carries over when you open a nested map.
//   mode 'off' = every pin normal;  'age' = year relative to an Age's start;  'abs' = absolute year
let timeView = { mode: 'off', ageId: null, rel: 0, abs: 0 };
let childLinks = [];          // [{ map_id, child_map_id }] across all maps, for breadcrumbs
// Map events: things that happen in the world (start/end year), listed in the key bubble. Each carries pin_ids.
let mapEvents = [];
let selectedEventId = null;   // event highlighted from the key: its pins stay bright, the rest fade
let evForm = null;            // { mode:'new'|'edit', ev?, pinIds:[], tlId } while the event form is open
let eventsError = null;       // error loading map events (e.g. migration 004 not run yet)
let keyCollapsed = false;
const formOpen = () => !!(formState || evForm);

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function setStatus(el, msg, isErr) { el.textContent = msg || ''; el.classList.toggle('err', !!isErr); }
function typeOf(t) { return PIN_TYPES[t] || PIN_TYPES.other; }

// Pin position is stored as a fraction (0..1) of the image, origin top-left.
// Leaflet's CRS.Simple has y growing upward, so flip y when converting.
const toLatLng = p => [(1 - p.y) * currentMap.image_height, p.x * currentMap.image_width];
const toFrac   = ll => ({ x: ll.lng / currentMap.image_width, y: 1 - ll.lat / currentMap.image_height });
const clamp01  = n => Math.min(1, Math.max(0, n));

async function signedUrl(path) {
  const { data, error } = await supabase.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

// ─── Routing (#map=<id>) ─────────────────────────────────────────────────────
// Hash forms:  (empty) = map list,  #map=<id>  or  #map=<id>&pin=<pinId> (opens the map focused on that pin)
async function route() {
  const token = ++routeToken;
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const id = params.get('map');
  const pin = params.get('pin');
  const uuid = /^[0-9a-f-]{36}$/i;
  if (id && uuid.test(id)) await openMap(id, token, pin && uuid.test(pin) ? pin : null);
  else showList();
}
window.addEventListener('hashchange', route);

// ─── Map list ────────────────────────────────────────────────────────────────
async function loadMaps() {
  const { data, error } = await supabase.from('maps').select('*').order('created_at', { ascending: false });
  if (error) {
    maps = [];
    $('map-list').innerHTML = '<div class="mp-empty" style="color:#a33">Could not load maps: ' + esc(error.message) +
      '<br>Have you run <code>map-pinboard/schema.sql</code> in Supabase?</div>';
    return false;
  }
  maps = data || [];
  mapsLoaded = true;
  return true;
}

async function ensureMapsLoaded() { if (!mapsLoaded) await loadMaps(); }

// Timeline Ages + Events feed the "Timeline event" picker. Failure is non-fatal (the picker says so).
async function loadTimeline() {
  const [a, e] = await Promise.all([supabase.from('timeline_ages').select('*'), supabase.from('timeline_events').select('*')]);
  const err = a.error || e.error;
  tlError = err ? err.message : null;
  tlAges = a.data || [];
  tlEvents = e.data || [];
}

// Same display rule as the timeline page: "<n> <ABBR>" relative to the Age if it has an abbreviation, else "Year <n>".
function eventYearLabel(ev) {
  const age = tlAges.find(a => a.id === ev.age_id);
  return age && age.abbreviation ? (ev.year - age.start_year) + ' ' + age.abbreviation : 'Year ' + ev.year;
}
function eventLabel(ev) { return ev.title + ' — ' + eventYearLabel(ev); }

// ─── Year view ───────────────────────────────────────────────────────────────
// A pin has its own optional start_year / end_year (absolute years): blank start = always existed,
// blank end = still exists today. Map events have a start and end year too and live in the key bubble.
// Linking a pin to timeline events is only a reference now; it no longer decides when the pin exists.

function ageRangeLabel(a) {   // same wording as the timeline page
  if (a.abbreviation) return '0 – ' + (a.end_year != null ? a.end_year - a.start_year : 'present') + ' ' + a.abbreviation;
  return a.start_year + ' – ' + (a.end_year != null ? a.end_year : 'present');
}

// The Age containing an absolute year (the latest-starting one if Ages overlap), or undefined.
function ageOf(abs) {
  return tlAges.filter(a => abs >= a.start_year && (a.end_year == null || abs <= a.end_year))
    .sort((a, b) => b.start_year - a.start_year)[0];
}

// Absolute year -> label, using the Age that contains it.
function yearLabel(abs) {
  const age = ageOf(abs);
  return age && age.abbreviation ? (abs - age.start_year) + ' ' + age.abbreviation : 'Year ' + abs;
}

// The selected absolute year, or null when the view is off / incomplete.
function activeYear() {
  if (timeView.mode === 'abs') return Number.isFinite(timeView.abs) ? timeView.abs : null;
  if (timeView.mode === 'age') {
    const age = tlAges.find(a => a.id === timeView.ageId);
    return age && Number.isFinite(timeView.rel) ? age.start_year + timeView.rel : null;
  }
  return null;
}

// 'off' | 'timeless' | 'before' | 'active' | 'after'
function pinTimeStatus(pin) {
  const Y = activeYear();
  if (Y === null) return 'off';
  const s = pin.start_year, e = pin.end_year;
  if (s == null && e == null) return 'timeless';
  return s != null && Y < s ? 'before' : e != null && Y > e ? 'after' : 'active';
}

// A pin stays bright only if it passes every filter that is on: linked to the selected event (if one is
// selected) AND existing in the selected year (if the Year view is on). Anything else fades.
function isFaded(pin) {
  const ev = selectedEventId && mapEvents.find(e => e.id === selectedEventId);
  if (ev && !ev.pin_ids.includes(pin.id)) return true;
  const s = pinTimeStatus(pin);
  return s === 'before' || s === 'after';
}

function pinRangeText(pin) {
  if (pin.start_year == null && pin.end_year == null) return '';
  return (pin.start_year == null ? 'the beginning' : yearLabel(pin.start_year)) + ' → ' + (pin.end_year == null ? 'today' : yearLabel(pin.end_year));
}

function eventRangeText(ev) {
  return ev.start_year === ev.end_year ? yearLabel(ev.start_year) : yearLabel(ev.start_year) + ' → ' + yearLabel(ev.end_year);
}
// 'off' | 'in' | 'out' — is the selected year inside the event's range?
function eventStatus(ev) {
  const Y = activeYear();
  if (Y === null) return 'off';
  return Y >= ev.start_year && Y <= ev.end_year ? 'in' : 'out';
}
const byStart = (a, b) => a.start_year - b.start_year || a.end_year - b.end_year || a.title.localeCompare(b.title);

// ─── Age + year picker (used for pin and event dates) ───────────────────────
// Entered as "year within an Age" (or an absolute year) and always stored as an absolute year.
function splitYear(abs) {
  if (abs == null) return { ageId: '', rel: '' };
  const age = ageOf(abs);
  return age ? { ageId: age.id, rel: abs - age.start_year } : { ageId: '', rel: abs };
}
const ageBase = id => { const a = tlAges.find(x => x.id === id); return a ? a.start_year : 0; };

function yearFieldHtml(p, abs) {
  const sp = splitYear(abs);
  const ages = tlAges.slice().sort((a, b) => a.start_year - b.start_year);
  return '<div class="yf"><select id="yf-' + p + '-age" data-base="' + ageBase(sp.ageId) + '" onchange="onYearBase(\'' + p + '\')">' +
      '<option value=""' + (sp.ageId ? '' : ' selected') + '>Absolute year</option>' +
      ages.map(a => '<option value="' + a.id + '"' + (a.id === sp.ageId ? ' selected' : '') + '>' + esc(a.name) + '</option>').join('') +
    '</select><input type="number" step="1" id="yf-' + p + '-n" value="' + sp.rel + '" placeholder="year" oninput="updateYearHint(\'' + p + '\')">' +
    '<span class="mp-hint" id="yf-' + p + '-hint"></span></div>';
}

// Absolute year from the field: null when blank, NaN when not a number.
function readYearField(p) {
  const v = $('yf-' + p + '-n').value.trim();
  if (v === '') return null;
  const n = parseInt(v, 10);
  return isNaN(n) ? NaN : ageBase($('yf-' + p + '-age').value) + n;
}

function setYearField(p, abs) {
  const sp = splitYear(abs);
  const sel = $('yf-' + p + '-age');
  sel.value = sp.ageId; sel.dataset.base = ageBase(sp.ageId);
  $('yf-' + p + '-n').value = sp.rel;
  updateYearHint(p);
}

// Changing the Age keeps the same absolute year (the number is re-expressed relative to the new Age).
function onYearBase(p) {
  const sel = $('yf-' + p + '-age'), inp = $('yf-' + p + '-n');
  const oldBase = parseFloat(sel.dataset.base) || 0, newBase = ageBase(sel.value);
  const n = parseInt(inp.value, 10);
  if (!isNaN(n)) inp.value = oldBase + n - newBase;
  sel.dataset.base = newBase;
  updateYearHint(p);
}

function updateYearHint(p) {
  const h = $('yf-' + p + '-hint');
  if (!h) return;
  const abs = readYearField(p);
  h.textContent = abs === null || isNaN(abs) ? '' : '= ' + yearLabel(abs) + (ageBase($('yf-' + p + '-age').value) ? ' (absolute ' + abs + ')' : '');
}

function renderTimeControl() {
  const el = $('mv-time');
  if (timeView.mode === 'age' && !tlAges.some(a => a.id === timeView.ageId)) timeView.mode = 'off';   // Age was deleted
  const on = timeView.mode !== 'off';
  const ages = tlAges.slice().sort((a, b) => a.start_year - b.start_year);
  el.className = 'mv-time' + (on || selectedEventId ? ' on' : '');
  el.innerHTML = '<span class="mv-time-label">⧗ Year view</span>' +
    '<select id="tv-mode" onchange="onTimeMode(this.value)">' +
      '<option value="off"' + (on ? '' : ' selected') + '>Off — show every pin</option>' +
      ages.map(a => '<option value="age:' + a.id + '"' + (timeView.mode === 'age' && timeView.ageId === a.id ? ' selected' : '') + '>' +
        esc(a.name) + ' (' + esc(ageRangeLabel(a)) + ')</option>').join('') +
      '<option value="abs"' + (timeView.mode === 'abs' ? ' selected' : '') + '>Absolute year…</option>' +
    '</select>' +
    (on
      ? '<input type="number" id="tv-year" step="1" value="' + (timeView.mode === 'age' ? timeView.rel : timeView.abs) + '" oninput="onTimeYear(this.value)" ' +
        'title="' + (timeView.mode === 'age' ? 'Year within this Age (0 = its first year)' : 'Absolute year') + '">'
      : (ages.length ? '' : '<span class="mp-hint">Add Ages in the Timeline Builder to pick a year by Age.</span>')) +
    '<select id="tv-event" onchange="onTimeEvent(this.value)" title="Show only the pins linked to an event"></select>' +
    '<span class="mp-hint" id="tv-hint"></span>' +
    (on || selectedEventId ? '<button class="mp-btn" onclick="clearTimeView()">Show all</button>' : '');
  renderEventSelect();
  updateTimeHint();
}

// The event dropdown in the Year view bar. Rebuilt in place (not with the rest of the bar) so the year box keeps focus while typing.
function renderEventSelect() {
  const sel = $('tv-event');
  if (!sel) return;
  const evs = mapEvents.slice().sort(byStart);
  sel.disabled = !!eventsError || !evs.length;
  sel.innerHTML = '<option value="">' + (eventsError ? '⚑ Events unavailable' : evs.length ? '⚑ No event selected' : '⚑ No events yet') + '</option>' +
    evs.map(ev => '<option value="' + ev.id + '">' + esc(ev.title) + ' (' + esc(eventRangeText(ev)) + ')</option>').join('');
  sel.value = selectedEventId && evs.some(e => e.id === selectedEventId) ? selectedEventId : '';
}

// Picking an event also jumps the year to the event's start (see selectEvent); "No event" just clears the event.
function onTimeEvent(v) {
  if (formOpen()) { renderEventSelect(); return; }       // finish or cancel the open form first
  if (v) selectEvent(v, true);
  else if (selectedEventId) selectEvent(selectedEventId);
}

// Set the Year view to an absolute year, using the Age that contains it when there is one.
function setYearTo(abs) {
  const age = ageOf(abs);
  if (age) Object.assign(timeView, { mode: 'age', ageId: age.id, rel: abs - age.start_year });
  else Object.assign(timeView, { mode: 'abs', abs });
}

function onTimeMode(v) {
  if (v === 'off') timeView.mode = 'off';
  else if (v === 'abs') { const y = activeYear(); timeView.mode = 'abs'; timeView.abs = y === null ? 0 : y; }
  else { timeView.mode = 'age'; timeView.ageId = v.slice(4); timeView.rel = 0; }
  renderTimeControl();
  onTimeChanged();
}

function onTimeYear(v) {
  const n = parseInt(v, 10);
  if (timeView.mode === 'age') timeView.rel = isNaN(n) ? NaN : n; else timeView.abs = isNaN(n) ? NaN : n;
  onTimeChanged();
}

function clearTimeView() { timeView.mode = 'off'; selectedEventId = null; renderTimeControl(); onTimeChanged(); }

// Re-fade markers; refresh the side panel too unless a form is open (re-rendering it would lose typing).
function onTimeChanged() {
  applyTimeView();
  if (!formOpen()) renderPanel();
}

function updateTimeHint() {
  const h = $('tv-hint');
  if (!h) return;
  const Y = activeYear();
  const ev = selectedEventId && mapEvents.find(e => e.id === selectedEventId);
  if (Y === null && !ev) { h.textContent = timeView.mode !== 'off' ? 'Enter a year.' : ''; return; }
  const faded = pins.filter(isFaded).length;
  const parts = [];
  if (Y !== null) { const lab = yearLabel(Y); parts.push(lab + (lab === 'Year ' + Y ? '' : ' (absolute year ' + Y + ')')); }
  if (ev) parts.push('⚑ ' + ev.title);
  h.textContent = parts.join(' · ') + ' — ' + (pins.length - faded) + ' shown, ' + faded + ' faded';
}

// Fade pins that did not exist yet / no longer exist in the selected year (still visible, still clickable).
function applyTimeView() {
  if (!lmap) return;
  pins.forEach(p => {
    const mk = markers.get(p.id);
    if (!mk) return;
    const faded = isFaded(p);
    mk.setOpacity(faded ? (p.id === selectedId ? 0.65 : 0.28) : 1);
    mk.setZIndexOffset(p.id === selectedId ? 1000 : faded ? -500 : 0);
  });
  updateTimeHint();
  renderKey();
}

// Panel text for a pin: when it existed, and where it stands in the selected year.
function timeStateHtml(pin) {
  const st = pinTimeStatus(pin);
  const range = pinRangeText(pin);
  let html = range ? '<div class="pv-when">🕰 Exists: ' + esc(range) + '</div>' : '';
  if (st === 'before') html += '<div class="pv-state faded">Not yet — appears ' + esc(yearLabel(pin.start_year)) + '</div>';
  else if (st === 'after') html += '<div class="pv-state faded">Gone — ended ' + esc(yearLabel(pin.end_year)) + '</div>';
  else if (st === 'active') html += '<div class="pv-state ok">✓ Exists in ' + esc(yearLabel(activeYear())) + '</div>';
  else if (st === 'timeless') html += '<div class="pv-state">No dates set — always shown</div>';
  return html;
}

function thumbPath(m) { return m.user_id + '/' + m.id + '/thumb.jpg'; }

async function renderMapList() {
  const el = $('map-list');
  if (!maps.length) { el.innerHTML = '<div class="mp-empty">No maps yet. Upload one above to get started.</div>'; return; }
  el.innerHTML = '<div class="mp-grid">' + maps.map(m =>
    '<div class="mp-card">' +
      '<div class="mp-card-thumb" id="thumb-' + m.id + '" onclick="location.hash=\'#map=' + m.id + '\'">🗺</div>' +
      '<div class="mp-card-body">' +
        '<div class="mp-card-name" title="' + esc(m.name) + '" onclick="location.hash=\'#map=' + m.id + '\'">' + esc(m.name) + '</div>' +
        '<div class="mp-card-sub">' + m.image_width + ' × ' + m.image_height + ' px</div>' +
        '<div class="mp-card-actions">' +
          '<button class="mp-btn mp-btn-primary" onclick="location.hash=\'#map=' + m.id + '\'">Open</button>' +
          '<button class="mp-btn mp-btn-danger" onclick="deleteMap(\'' + m.id + '\')">Delete</button>' +
        '</div>' +
      '</div>' +
    '</div>').join('') + '</div>';

  // Fill thumbnails (best effort; a missing thumb just keeps the placeholder).

  (data || []).forEach((row, i) => {
    if (!row || row.error || !row.signedUrl) return;

function showList() {
  destroyMapView();
  $('view-map').hidden = true;
  $('view-list').hidden = false;
  $('back-btn').hidden = false;
  document.title = 'Map Pinboard';
  loadMaps().then(ok => { if (ok) renderMapList(); });
}

// ─── Create map ──────────────────────────────────────────────────────────────
function readImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url, width: img.naturalWidth, height: img.naturalHeight });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file could not be read as an image.')); };
    img.src = url;
  });
}

function makeThumb(img, maxSide) {
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.82));
}

async function createMap() {
  const status = $('create-status');
  const btn = $('create-btn');
  const name = $('new-name').value.trim();
  const file = $('new-file').files[0];
  if (!name) return setStatus(status, 'Give the map a name.', true);
  if (!file) return setStatus(status, 'Choose an image file.', true);
  const ext = EXT_FOR_TYPE[file.type];
  if (!ext) return setStatus(status, 'Only PNG, JPEG or WebP images are supported.', true);
  if (file.size > MAX_BYTES) return setStatus(status, 'That file is over 25 MB. Try a smaller or compressed version.', true);

  btn.disabled = true;
  const uploaded = [];
  let imgInfo = null;
  try {
    setStatus(status, 'Reading image…');
    imgInfo = await readImage(file);

    const id = crypto.randomUUID();
    const basePath = currentUser.id + '/' + id + '/base.' + ext;
    const tPath = currentUser.id + '/' + id + '/thumb.jpg';

    setStatus(status, 'Uploading…');
    const up = await supabase.storage.from(BUCKET).upload(basePath, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    uploaded.push(basePath);

    try {   // thumbnail is a nicety; never fail the whole upload for it
      const thumb = await makeThumb(imgInfo.img, 480);
      if (thumb) {
        const tu = await supabase.storage.from(BUCKET).upload(tPath, thumb, { contentType: 'image/jpeg', upsert: false });
        if (!tu.error) uploaded.push(tPath);
      }
    } catch (e) { console.warn('thumbnail skipped', e); }

    setStatus(status, 'Saving…');
    const { data, error } = await supabase.from('maps').insert({
      id, user_id: currentUser.id, name,
      image_path: basePath, image_width: imgInfo.width, image_height: imgInfo.height,
    }).select().single();
    if (error) throw error;

    $('new-name').value = ''; $('new-file').value = '';
    setStatus(status, '');
    location.hash = '#map=' + data.id;
  } catch (e) {
    if (uploaded.length) await supabase.storage.from(BUCKET).remove(uploaded);   // don't leave orphans
    setStatus(status, 'Could not create map: ' + (e.message || e), true);
  } finally {
    if (imgInfo) URL.revokeObjectURL(imgInfo.url);
    btn.disabled = false;
  }
}

async function deleteMap(id) {
  const m = maps.find(x => x.id === id);
  if (!m) return;
  if (!confirm('Delete "' + m.name + '" and all of its pins? This cannot be undone.')) return;
  const { error } = await supabase.from('maps').delete().eq('id', id);   // pins cascade
  if (error) { alert('Could not delete: ' + error.message); return; }
  // DB cascade does not touch Storage, so remove the files ourselves.
  const paths = [m.image_path, m.grid_image_path, thumbPath(m)].filter(Boolean);
  const rm = await supabase.storage.from(BUCKET).remove(paths);
  if (rm.error) console.warn('Map deleted, but files could not be removed:', rm.error);
  maps = maps.filter(x => x.id !== id);
  renderMapList();
}

// ─── Map view ────────────────────────────────────────────────────────────────
function destroyMapView() {
  if (resizeObs) { resizeObs.disconnect(); resizeObs = null; }
  if (lmap) { lmap.remove(); lmap = null; }
  markers.clear();
  currentMap = null; pins = []; selectedId = null; formState = null; addMode = false;
  hiddenTypes = new Set(); pinSearch = ''; renaming = false;
  mapEvents = []; selectedEventId = null; evForm = null; eventsError = null;
  $('mv-filters').hidden = true; $('mv-key').hidden = true; $('add-pin-btn').disabled = false;
}

async function openMap(id, token, focusPinId) {
  destroyMapView();
  $('view-list').hidden = true;
  $('view-map').hidden = false;
  $('back-btn').hidden = true;
  $('side-panel').innerHTML = '<div class="mp-empty">Loading map…</div>';

  let row = maps.find(m => m.id === id);
  if (!row) {
    const { data, error } = await supabase.from('maps').select('*').eq('id', id).maybeSingle();
    if (token !== routeToken) return;
    if (error || !data) { alert('That map could not be found.'); location.hash = ''; return; }
    row = data;
  }
  currentMap = row;
  $('mv-name').textContent = row.name;
  document.title = row.name + ' · Map Pinboard';

  let url;
  try { url = await signedUrl(row.image_path); }
  catch (e) {
    if (token !== routeToken) return;
    $('side-panel').innerHTML = '<div class="mp-empty" style="color:#a33">Could not load the map image: ' + esc(e.message || e) + '</div>';
    return;
  }
  const [pinsRes, childRes, linksRes, eventsRes, evLinksRes] = await Promise.all([
    supabase.from('map_pins').select('*').eq('map_id', id).order('created_at', { ascending: true }),
    supabase.from('map_pins').select('map_id, child_map_id').not('child_map_id', 'is', null),   // for breadcrumbs
    supabase.from('map_pin_events').select('pin_id, event_id'),                                   // pin <-> timeline event links
    supabase.from('map_events').select('*').eq('map_id', id),                                     // this map's events (the key)
    supabase.from('map_event_pins').select('event_id, pin_id'),                                   // pin <-> map event links
    loadTimeline(),
    ensureMapsLoaded(),
  ]);
  if (token !== routeToken) return;    // user navigated away while we were loading
  pins = pinsRes.data || [];
  childLinks = childRes.data || [];
  renderTimeControl();
  // Attach each pin's linked timeline event ids as pin.event_ids (client-side only; never sent back in updates).
  const evByPin = {};
  (linksRes.data || []).forEach(r => { (evByPin[r.pin_id] = evByPin[r.pin_id] || []).push(r.event_id); });
  pins.forEach(p => { p.event_ids = evByPin[p.id] || []; });
  linksError = linksRes.error ? linksRes.error.message : null;
  eventsError = eventsRes.error ? eventsRes.error.message : evLinksRes.error ? evLinksRes.error.message : null;
  mapEvents = eventsRes.data || [];
  attachEventLinks(evLinksRes.data || []);
  renderCrumbs();

  const W = row.image_width, H = row.image_height;
  const bounds = [[0, 0], [H, W]];
  lmap = L.map('map', { crs: L.CRS.Simple, minZoom: -6, maxZoom: 3, zoomSnap: 0.25, zoomDelta: 0.5,
                        attributionControl: false, maxBoundsViscosity: 0.7 });
  L.imageOverlay(url, bounds).addTo(lmap);
  const fitMap = () => {
    lmap.setMinZoom(-10);                       // lift the floor so fitBounds can pick the true zoom
    lmap.fitBounds(bounds, { animate: false });
    lmap.setMinZoom(lmap.getZoom() - 1);
  };
  fitMap();
  lmap.setMaxBounds(L.latLngBounds(bounds).pad(0.3));

  // Keep Leaflet in step with its container (the filter bar appearing, window resizes, a container that
  // wasn't laid out yet when the map was created). Until the user pans/zooms or a pin is focused, a resize
  // re-fits the whole image; after that we only re-measure so their view isn't yanked around.
  let userMoved = false;
  ['mousedown', 'wheel', 'touchstart'].forEach(ev => $('map').addEventListener(ev, () => { userMoved = true; }, { passive: true }));
  if (focusPinId) userMoved = true;
  if (resizeObs) resizeObs.disconnect();
  resizeObs = new ResizeObserver(() => {
    if (!lmap) return;
    lmap.invalidateSize();
    if (!userMoved && lmap.getSize().x > 0 && lmap.getSize().y > 0) fitMap();
  });
  resizeObs.observe($('map'));

  lmap.on('click', onMapClick);
  pins.forEach(addMarker);
  renderPanel();
  if (focusPinId && pins.some(p => p.id === focusPinId)) focusPin(focusPinId);   // deep link from the timeline page
  if (pinsRes.error) $('side-panel').insertAdjacentHTML('afterbegin', '<div class="mp-status err">Could not load pins: ' + esc(pinsRes.error.message) + '</div>');
  if (linksError) $('side-panel').insertAdjacentHTML('afterbegin', '<div class="mp-status err">Could not load timeline links: ' + esc(linksError) +
    '<br>Have you run <code>migration-002-multi-event-pins.sql</code>?</div>');
}

// Give every map event its pin_ids from the join-table rows (rows for other maps' events are ignored).
function attachEventLinks(rows) {
  const by = {};
  rows.forEach(r => { (by[r.event_id] = by[r.event_id] || []).push(r.pin_id); });
  mapEvents.forEach(ev => { ev.pin_ids = by[ev.id] || []; });
}
async function reloadEventLinks() {          // best effort: resync after a failed save
  try {
    const r = await supabase.from('map_event_pins').select('event_id, pin_id');
    if (!r.error) attachEventLinks(r.data || []);
  } catch (e) { /* ignore */ }
}

// ─── Breadcrumbs (ancestor maps reached via a pin's "opens map" link) ────────
function renderCrumbs() {
  const parentOf = {};
  childLinks.forEach(l => { if (l.map_id !== l.child_map_id && !(l.child_map_id in parentOf)) parentOf[l.child_map_id] = l.map_id; });
  const chain = [];
  const seen = new Set([currentMap.id]);
  for (let cur = parentOf[currentMap.id]; cur && !seen.has(cur) && chain.length < 12; cur = parentOf[cur]) { seen.add(cur); chain.unshift(cur); }
  $('mv-crumbs').innerHTML =
    '<button class="mp-btn" onclick="location.hash=\'\'">← All maps</button>' +
    chain.map(id => { const m = maps.find(x => x.id === id);
      return '<span class="mv-crumb-sep">›</span><button class="mv-crumb" onclick="location.hash=\'#map=' + id + '\'">' + esc(m ? m.name : 'Map') + '</button>'; }).join('') +
    (chain.length ? '<span class="mv-crumb-sep">›</span>' : '');
}

// ─── Markers ─────────────────────────────────────────────────────────────────
function pinIcon(type, opts) {
  opts = opts || {};
  const t = typeOf(type);
  return L.divIcon({
    className: 'pin-wrap',
    html: '<div class="pin' + (opts.selected ? ' selected' : '') + (opts.draft ? ' draft' : '') + '" style="--c:' + t.color + '">' + t.glyph +
          (opts.child ? '<span class="pin-badge" title="Opens another map">↳</span>' : '') + '</div>',
    iconSize: [30, 30], iconAnchor: [15, 15],
  });
}

function addMarker(pin) {
  const mk = L.marker(toLatLng(pin), { icon: pinIcon(pin.pin_type, { selected: pin.id === selectedId, child: !!pin.child_map_id }), draggable: false, keyboard: false })
    .addTo(lmap)
    .bindTooltip(esc(pin.title), { direction: 'top', offset: [0, -16] });
  mk.on('click', () => selectPin(pin.id));
  mk.on('dragend', () => onDragEnd(pin.id, mk));
  markers.set(pin.id, mk);
  return mk;
}

function refreshMarker(pin) {
  const mk = markers.get(pin.id);
  if (!mk) return;
  mk.setIcon(pinIcon(pin.pin_type, { selected: pin.id === selectedId, child: !!pin.child_map_id }));
  mk.setLatLng(toLatLng(pin));
  mk.setTooltipContent(esc(pin.title));
  mk.setZIndexOffset(pin.id === selectedId ? 1000 : 0);
  applyTimeView();
}

function selectPin(id) {
  if (formOpen()) return;                      // finish or cancel the open form first
  const prev = pins.find(p => p.id === selectedId);
  if (prev && markers.get(prev.id)) markers.get(prev.id).dragging.disable();
  selectedId = id;
  if (prev) refreshMarker(prev);
  const cur = pins.find(p => p.id === id);
  if (cur) { refreshMarker(cur); markers.get(cur.id).dragging.enable(); }
  renderPanel();
}

async function onDragEnd(id, mk) {
  const pin = pins.find(p => p.id === id);
  if (!pin) return;
  const f = toFrac(mk.getLatLng());
  const x = clamp01(f.x), y = clamp01(f.y);
  if (formState && formState.mode === 'edit' && formState.pin.id === id) {   // just move the form's coordinates
    formState.x = x; formState.y = y; updateCoordsHint(); return;
  }
  const { error } = await supabase.from('map_pins').update({ x, y }).eq('id', id);
  if (error) { mk.setLatLng(toLatLng(pin)); alert('Could not move pin: ' + error.message); return; }
  pin.x = x; pin.y = y;
  refreshMarker(pin);
}

// ─── Add / edit pin ──────────────────────────────────────────────────────────
function setAddMode(on) {
  addMode = on;
  $('add-pin-btn').classList.toggle('mp-btn-active', on);
  $('mv-banner').hidden = !on;
  $('map').classList.toggle('adding', on);
}

function toggleAddMode() {
  if (!lmap || formOpen()) return;
  if (!addMode) selectPin(null);
  setAddMode(!addMode);
}

function onMapClick(e) {
  if (addMode) {
    const f = toFrac(e.latlng);
    if (f.x < 0 || f.x > 1 || f.y < 0 || f.y > 1) return;       // clicked outside the image
    setAddMode(false);
    beginForm('new', { x: f.x, y: f.y });
  } else if (!formOpen() && selectedId) {
    selectPin(null);
  }
}

function beginForm(mode, data) {
  if (evForm) return;
  if (mode === 'new') {
    const mk = L.marker(toLatLng(data), { icon: pinIcon('landmark', { draft: true }), draggable: true, keyboard: false, zIndexOffset: 2000 }).addTo(lmap);
    mk.on('dragend', () => {
      const f = toFrac(mk.getLatLng());
      formState.x = clamp01(f.x); formState.y = clamp01(f.y);
      updateCoordsHint();
    });
    formState = { mode, x: data.x, y: data.y, type: 'landmark', draftMarker: mk, eventIds: [], mapEventIds: [] };
  } else {
    const pin = data;
    formState = { mode, pin, x: pin.x, y: pin.y, type: pin.pin_type, eventIds: (pin.event_ids || []).slice(),
                  mapEventIds: mapEvents.filter(e => e.pin_ids.includes(pin.id)).map(e => e.id) };
  }
  $('add-pin-btn').disabled = true;
  renderPanel();
  const t = $('pf-title'); if (t) t.focus();
}

function endForm() {
  if (formState && formState.draftMarker) formState.draftMarker.remove();
  formState = null;
  $('add-pin-btn').disabled = false;
}

function cancelForm() {
  if (!formState) return;
  if (formState.mode === 'edit') refreshMarker(formState.pin);   // snap back to saved position/icon
  endForm();
  renderPanel();
}

function onFormTypeChange(type) {
  formState.type = type;
  if (formState.mode === 'new') formState.draftMarker.setIcon(pinIcon(type, { draft: true }));
  else markers.get(formState.pin.id).setIcon(pinIcon(type, { selected: true, child: !!formState.pin.child_map_id }));
}

function updateCoordsHint() {
  const el = $('pf-coords');
  if (el && formState) el.textContent = 'Position: ' + (formState.x * 100).toFixed(1) + '% across, ' + (formState.y * 100).toFixed(1) + '% down · drag the marker to adjust';
}

async function savePin() {
  const status = $('pf-status');
  const title = $('pf-title').value.trim();
  const description = $('pf-desc').value.trim();
  const pin_type = $('pf-type').value;
  const child_map_id = $('pf-child').value || null;
  const start_year = readYearField('ps'), end_year = readYearField('pe');
  if (!title) return setStatus(status, 'A pin needs a title.', true);
  if (Number.isNaN(start_year) || Number.isNaN(end_year)) return setStatus(status, 'Years must be whole numbers.', true);
  if (start_year !== null && end_year !== null && end_year < start_year) return setStatus(status, 'The "Until" year is before the "Exists from" year.', true);
  const btn = $('pf-save'); btn.disabled = true;
  const isNew = formState.mode === 'new';
  const wanted = formState.eventIds.slice();
  const wantedMapEvents = formState.mapEventIds.slice();
  let pin;

  // 1) the pin row itself
  try {
    if (isNew) {
      const { data, error } = await supabase.from('map_pins').insert({
        map_id: currentMap.id, user_id: currentUser.id,
        x: formState.x, y: formState.y, title, pin_type, description: description || null, child_map_id, start_year, end_year,
      }).select().single();
      if (error) throw error;
      pin = data; pin.event_ids = [];
    } else {
      pin = formState.pin;
      const patch = { x: formState.x, y: formState.y, title, pin_type, description: description || null, child_map_id, start_year, end_year };
      const { error } = await supabase.from('map_pins').update(patch).eq('id', pin.id);
      if (error) throw error;
      Object.assign(pin, patch);
    }
  } catch (e) {
    const missingCol = /start_year|end_year/.test(e.message || '') ? ' — have you run migration-004-pin-dates-and-map-events.sql?' : '';
    setStatus(status, 'Could not save: ' + (e.message || e) + missingCol, true);
    btn.disabled = false;
    return;
  }

  // 2) its links (separate tables). If one fails the pin is still saved, so don't lose it.
  const linkErrors = [];
  if (!sameSet(wanted, pin.event_ids || [])) {
    try { await syncPinEvents(pin.id, wanted); pin.event_ids = wanted; }
    catch (e) { linkErrors.push('timeline events: ' + (e.message || e)); await refreshPinEvents(pin); }
  }
  const haveMapEvents = mapEvents.filter(e => e.pin_ids.includes(pin.id)).map(e => e.id);
  if (!sameSet(wantedMapEvents, haveMapEvents)) {
    try {
      await syncLinks('pin_id', pin.id, wantedMapEvents);
      mapEvents.forEach(ev => {
        const has = ev.pin_ids.includes(pin.id), want = wantedMapEvents.includes(ev.id);
        if (want && !has) ev.pin_ids.push(pin.id);
        if (!want && has) ev.pin_ids = ev.pin_ids.filter(x => x !== pin.id);
      });
    } catch (e) { linkErrors.push('map events: ' + (e.message || e)); await reloadEventLinks(); }
  }

  // 3) update the UI
  if (isNew) {
    pins.push(pin);
    endForm();
    addMarker(pin);
    selectedId = null;
    selectPin(pin.id);
  } else {
    endForm();
    refreshMarker(pin);
    renderPanel();
  }
  if (linkErrors.length) alert('The pin was saved, but some links could not be updated:\n' + linkErrors.join('\n'));
}

function sameSet(a, b) { return a.length === b.length && a.every(x => b.includes(x)); }

// Make the database's links for a pin match `wanted` (reads current state first, so it is safe to retry).
async function syncPinEvents(pinId, wanted) {
  const cur = await supabase.from('map_pin_events').select('event_id').eq('pin_id', pinId);
  if (cur.error) throw cur.error;
  const have = (cur.data || []).map(r => r.event_id);
  const toAdd = wanted.filter(id => !have.includes(id));
  const toRemove = have.filter(id => !wanted.includes(id));
  if (toRemove.length) {
    const r = await supabase.from('map_pin_events').delete().eq('pin_id', pinId).in('event_id', toRemove);
    if (r.error) throw r.error;
  }
  if (toAdd.length) {
    const r = await supabase.from('map_pin_events').insert(toAdd.map(event_id => ({ pin_id: pinId, event_id, user_id: currentUser.id })));
    if (r.error) throw r.error;
  }
}

// Make the map_event_pins rows for one event (by='event_id') or one pin (by='pin_id') match `wanted` (ids of the other side).
async function syncLinks(by, id, wanted) {
  const other = by === 'event_id' ? 'pin_id' : 'event_id';
  const cur = await supabase.from('map_event_pins').select(other).eq(by, id);
  if (cur.error) throw cur.error;
  const have = (cur.data || []).map(r => r[other]);
  const toAdd = wanted.filter(x => !have.includes(x));
  const toRemove = have.filter(x => !wanted.includes(x));
  if (toRemove.length) {
    const r = await supabase.from('map_event_pins').delete().eq(by, id).in(other, toRemove);
    if (r.error) throw r.error;
  }
  if (toAdd.length) {
    const r = await supabase.from('map_event_pins').insert(toAdd.map(o => ({ [by]: id, [other]: o, user_id: currentUser.id })));
    if (r.error) throw r.error;
  }
}

async function refreshPinEvents(pin) {     // best effort: resync the local copy after a failed save
  try {
    const r = await supabase.from('map_pin_events').select('event_id').eq('pin_id', pin.id);
    if (!r.error) pin.event_ids = (r.data || []).map(x => x.event_id);
  } catch (e) { /* ignore */ }
}

// ─── Event picker inside the pin form ────────────────────────────────────────
function formEventsHtml() {
  const evs = formState.eventIds.map(id => tlEvents.find(e => e.id === id) || { id, title: '(unknown event)', year: 0, unknown: true })
    .sort((a, b) => a.year - b.year);
  return evs.map(e => '<div class="pf-ev"><span>' + esc(e.unknown ? e.title : eventLabel(e)) + '</span>' +
      '<button type="button" class="pf-ev-x" title="Remove" onclick="removeFormEvent(\'' + e.id + '\')">✕</button></div>').join('') +
    '<select id="pf-event-add" onchange="addFormEvent(this.value)">' + eventOptionsHtml(formState.eventIds) + '</select>';
}
function addFormEvent(id) {
  if (id && !formState.eventIds.includes(id)) formState.eventIds.push(id);
  $('pf-events').innerHTML = formEventsHtml();
}
function removeFormEvent(id) {
  formState.eventIds = formState.eventIds.filter(x => x !== id);
  $('pf-events').innerHTML = formEventsHtml();
}

// ─── Map event picker inside the pin form ────────────────────────────────────
function formMapEventsHtml() {
  const chosen = formState.mapEventIds.map(id => mapEvents.find(e => e.id === id)).filter(Boolean).sort(byStart);
  const rest = mapEvents.filter(e => !formState.mapEventIds.includes(e.id)).sort(byStart);
  return chosen.map(e => '<div class="pf-ev"><span>' + esc(e.title) + ' — ' + esc(eventRangeText(e)) + '</span>' +
      '<button type="button" class="pf-ev-x" title="Remove" onclick="removeFormMapEvent(\'' + e.id + '\')">✕</button></div>').join('') +
    (rest.length ? '<select onchange="addFormMapEvent(this.value)"><option value="">+ Link a map event…</option>' +
      rest.map(e => '<option value="' + e.id + '">' + esc(e.title) + ' — ' + esc(eventRangeText(e)) + '</option>').join('') + '</select>' : '');
}
function addFormMapEvent(id) {
  if (id && !formState.mapEventIds.includes(id)) formState.mapEventIds.push(id);
  $('pf-mevents').innerHTML = formMapEventsHtml();
}
function removeFormMapEvent(id) {
  formState.mapEventIds = formState.mapEventIds.filter(x => x !== id);
  $('pf-mevents').innerHTML = formMapEventsHtml();
}

async function deletePin(id) {
  const pin = pins.find(p => p.id === id);
  if (!pin || !confirm('Delete the pin "' + pin.title + '"?')) return;
  const { error } = await supabase.from('map_pins').delete().eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  const mk = markers.get(id); if (mk) mk.remove();
  markers.delete(id);
  pins = pins.filter(p => p.id !== id);
  mapEvents.forEach(ev => { ev.pin_ids = ev.pin_ids.filter(x => x !== id); });
  if (formState) endForm();
  selectedId = null;
  renderPanel();
}

function focusPin(id) {
  const pin = pins.find(p => p.id === id);
  if (!pin || !lmap) return;
  lmap.setView(toLatLng(pin), Math.max(lmap.getZoom(), lmap.getMinZoom() + 1), { animate: true });
  selectPin(id);
}

// ─── Map events: the key bubble, event panel and event form ─────────────────
function renderKey() {
  const el = $('mv-key');
  if (!lmap) { el.hidden = true; return; }
  el.hidden = false;
  const oldList = el.querySelector('.mv-key-list');
  const scroll = oldList ? oldList.scrollTop : 0;
  const evs = mapEvents.slice().sort(byStart);
  const rows = eventsError
    ? '<div class="mv-key-note" style="color:#a33">Could not load events: ' + esc(eventsError) + '<br>Have you run <code>migration-004</code>?</div>'
    : evs.length
      ? evs.map(ev => {
          const st = eventStatus(ev);
          return '<div class="mv-key-row' + (st === 'in' ? ' in' : st === 'out' ? ' out' : '') + (ev.id === selectedEventId ? ' sel' : '') + '" onclick="selectEvent(\'' + ev.id + '\')" ' +
            'title="' + esc(ev.title) + ' — click to show its pins">' +
            '<div class="mv-key-ttl">⚑ ' + esc(ev.title) + '</div>' +
            '<div class="mv-key-yrs">' + esc(eventRangeText(ev)) + ' · ' + ev.pin_ids.length + ' pin' + (ev.pin_ids.length === 1 ? '' : 's') + '</div></div>';
        }).join('')
      : '<div class="mv-key-note">No events yet. Press + to add one (a war, a festival, a reign…).</div>';
  el.innerHTML = '<div class="mv-key-head"><span class="mv-key-h" onclick="toggleKey()" title="Show / hide the list">⚑ Events (' + mapEvents.length + ') ' + (keyCollapsed ? '▸' : '▾') + '</span>' +
      '<button class="mv-key-btn" title="Add an event" onclick="beginEventForm(\'new\')"' + (formOpen() || eventsError ? ' disabled' : '') + '>+</button></div>' +
    (keyCollapsed ? '' : '<div class="mv-key-list">' + rows + '</div>');
  const list = el.querySelector('.mv-key-list');
  if (list) list.scrollTop = scroll;
}

function toggleKey() { keyCollapsed = !keyCollapsed; renderKey(); }

// Click a key row: its pins stay bright and the rest of the map fades. Click again (or Esc) to clear.
function selectEvent(id, forceOn) {
  if (formOpen()) return;
  if (selectedId) selectPin(null);
  const prev = selectedEventId;
  selectedEventId = forceOn ? id : selectedEventId === id ? null : id;
  const ev = selectedEventId && mapEvents.find(e => e.id === selectedEventId);
  if (ev && selectedEventId !== prev) setYearTo(ev.start_year);      // jump the year to when the event began
  renderTimeControl();
  renderPanel();
}

function eventHtml(ev) {
  const st = eventStatus(ev);
  const linked = ev.pin_ids.map(id => pins.find(p => p.id === id)).filter(Boolean).sort((a, b) => a.title.localeCompare(b.title));
  const tl = ev.timeline_event_id && tlEvents.find(e => e.id === ev.timeline_event_id);
  return '<div class="pv-title">⚑ ' + esc(ev.title) + '</div>' +
    '<div class="pv-when">🕰 ' + esc(eventRangeText(ev)) + '</div>' +
    (st === 'in' ? '<div class="pv-state ok">✓ In effect in ' + esc(yearLabel(activeYear())) + '</div>'
      : st === 'out' ? '<div class="pv-state faded">Not in effect in ' + esc(yearLabel(activeYear())) + '</div>' : '') +
    (ev.description ? '<div class="pv-desc">' + esc(ev.description) + '</div>' : '<div class="mp-hint" style="margin-bottom:1rem">No description yet.</div>') +
    '<div class="pv-link"><div class="pv-link-label">Pins (' + linked.length + ')</div>' +
      (linked.length ? linked.map(p => { const t = typeOf(p.pin_type);
        return '<div class="pin-row" onclick="focusPin(\'' + p.id + '\')" style="--c:' + t.color + '"><span class="pin-row-icon">' + t.glyph + '</span>' +
          '<span class="pin-row-title">' + esc(p.title) + '</span></div>'; }).join('')
        : '<div class="mp-hint">No pins linked yet. Edit the event to add some.</div>') + '</div>' +
    (tl ? '<div class="pv-link"><div class="pv-link-label">Timeline event</div><div class="pv-link-main">⧗ ' + esc(tl.title) + ' · ' + esc(eventYearLabel(tl)) + '</div>' +
      '<a href="../timeline/index.html#event=' + tl.id + '">View on timeline →</a></div>' : '') +
    '<div class="pv-actions">' +
      '<button class="mp-btn mp-btn-primary" onclick="beginEventForm(\'edit\', mapEvents.find(e => e.id === selectedEventId))">Edit</button>' +
      '<button class="mp-btn" onclick="selectEvent(\'' + ev.id + '\')">Show all pins</button>' +
      '<button class="mp-btn mp-btn-danger" onclick="deleteEvent(\'' + ev.id + '\')">Delete</button>' +
    '</div>' +
    '<div class="mp-hint" style="margin-top:1rem">Pins linked to this event stay bright (if they exist in the chosen year); every other pin is faded.</div>';
}

function beginEventForm(mode, ev) {
  if (!lmap || formOpen() || eventsError) return;

  setAddMode(false);
  evForm = { mode, ev: ev || null, pinIds: ev ? ev.pin_ids.slice() : [], tlId: ev ? ev.timeline_event_id || null : null };

function endEventForm() { evForm = null; $('add-pin-btn').disabled = false; }
function cancelEventForm() { if (!evForm) return; endEventForm(); renderPanel(); }

function efPinsHtml() {

function addEventFormPin(id) { if (id && !evForm.pinIds.includes(id)) evForm.pinIds.push(id); $('ef-pins').innerHTML = efPinsHtml(); }
function removeEventFormPin(id) { evForm.pinIds = evForm.pinIds.filter(x => x !== id); $('ef-pins').innerHTML = efPinsHtml(); }

// Picking a timeline event is only a reference, but it fills in an empty title and start year for you.
function onEventTlChange(v) {
