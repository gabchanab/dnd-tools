function eventFormHtml() {
  const isNew = evForm.mode === 'new';
  const ev = evForm.ev || {};
  return '<div class="panel-title">' + (isNew ? 'New Event' : 'Edit Event') + '</div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="ef-title">Title</label>' +
      '<input type="text" id="ef-title" maxlength="120" placeholder="The Siege of Karth" value="' + esc(ev.title || '') + '" onkeydown="if(event.key===\'Enter\')saveEvent()"></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="ef-desc">Description</label>' +
      '<textarea id="ef-desc">' + esc(ev.description || '') + '</textarea></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Starts</label>' + yearFieldHtml('es', ev.start_year) + '</div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Ends</label>' + yearFieldHtml('ee', ev.end_year) +
      '<span class="mp-hint">Leave blank for a single-year event.</span></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Pins at this event</label><div id="ef-pins">' + efPinsHtml() + '</div></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="ef-tl">Timeline event (optional)</label>' +
      '<select id="ef-tl" onchange="onEventTlChange(this.value)">' + eventOptionsHtml([], '— none —', evForm.tlId) + '</select>' +
      '<span class="mp-hint">Just a reference. Picking one fills in an empty title and start year.</span>' +
      (tlError ? '<span class="mp-hint">Timeline could not be loaded: ' + esc(tlError) + '</span>' : '') + '</div></div>' +
    '<div class="pv-actions">' +
      '<button class="mp-btn mp-btn-primary" id="ef-save" onclick="saveEvent()">' + (isNew ? 'Add Event' : 'Save') + '</button>' +
      '<button class="mp-btn" onclick="cancelEventForm()">Cancel</button>' +
      (isNew ? '' : '<button class="mp-btn mp-btn-danger" onclick="deleteEvent(\'' + ev.id + '\')">Delete</button>') +
    '</div><div class="mp-status" id="ef-status"></div>';
}

async function saveEvent() {
  const status = $('ef-status');
  const title = $('ef-title').value.trim();
  const description = $('ef-desc').value.trim();
  const start_year = readYearField('es');
  let end_year = readYearField('ee');
  if (!title) return setStatus(status, 'An event needs a title.', true);
  if (start_year === null || Number.isNaN(start_year)) return setStatus(status, 'An event needs a start year (a whole number).', true);
  if (Number.isNaN(end_year)) return setStatus(status, 'The end year must be a whole number.', true);
  if (end_year === null) end_year = start_year;
  if (end_year < start_year) return setStatus(status, 'The end year is before the start year.', true);
  const timeline_event_id = evForm.tlId || null;
  const wanted = evForm.pinIds.slice();
  const isNew = evForm.mode === 'new';
  const btn = $('ef-save'); btn.disabled = true;
  let ev;

  try {
    if (isNew) {
      const { data, error } = await supabase.from('map_events').insert({
        map_id: currentMap.id, user_id: currentUser.id, title, description: description || null, start_year, end_year, timeline_event_id,
      }).select().single();
      if (error) throw error;
      ev = data; ev.pin_ids = [];
    } else {
      ev = evForm.ev;
      const patch = { title, description: description || null, start_year, end_year, timeline_event_id };
      const { error } = await supabase.from('map_events').update(patch).eq('id', ev.id);
      if (error) throw error;
      Object.assign(ev, patch);
    }
  } catch (e) {
    setStatus(status, 'Could not save: ' + (e.message || e) + (/map_events|relation/.test(e.message || '') ? ' — have you run migration-004-pin-dates-and-map-events.sql?' : ''), true);
    btn.disabled = false;
    return;
  }

  let linkError = null;
  if (!sameSet(wanted, ev.pin_ids || [])) {
    try { await syncLinks('event_id', ev.id, wanted); ev.pin_ids = wanted; }
    catch (e) { linkError = e; await reloadEventLinks(); }
  }
  if (isNew) { mapEvents.push(ev); selectedEventId = ev.id; setYearTo(ev.start_year); }
  endEventForm();
  renderTimeControl();
  renderPanel();
  if (linkError) alert('The event was saved, but its pins could not be updated:\n' + (linkError.message || linkError));
}

async function deleteEvent(id) {
  const ev = mapEvents.find(e => e.id === id);
  if (!ev || !confirm('Delete the event "' + ev.title + '"? (Its pins are not deleted.)')) return;
  const { error } = await supabase.from('map_events').delete().eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  mapEvents = mapEvents.filter(e => e.id !== id);
  if (selectedEventId === id) selectedEventId = null;
  if (evForm) endEventForm();
  renderTimeControl();
  renderPanel();
}

// ─── Side panel ──────────────────────────────────────────────────────────────
function renderPanel() {
  const el = $('side-panel');
  const pin = pins.find(p => p.id === selectedId);
  const ev = mapEvents.find(e => e.id === selectedEventId);
  if (evForm) el.innerHTML = eventFormHtml();
  else if (formState) { el.innerHTML = formHtml(); updateCoordsHint(); }
  else if (pin) el.innerHTML = pinHtml(pin);
  else if (ev) el.innerHTML = eventHtml(ev);
  else el.innerHTML = listHtml();
  if (formState) { updateYearHint('ps'); updateYearHint('pe'); }
  if (evForm) { updateYearHint('es'); updateYearHint('ee'); }
  renderFilters();
  applyFilters();
  applyTimeView();
}

// Pins that pass the type filter and the search box (used by the side-panel list).
function listedPins() {
  const q = pinSearch.trim().toLowerCase();
  return pins
    .filter(p => !hiddenTypes.has(p.pin_type))
    .filter(p => !q || p.title.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q))
    .sort((a, b) => a.title.localeCompare(b.title));
}

function pinRowsHtml() {
  const list = listedPins();
  if (list.length) {
    return list.map(p => { const t = typeOf(p.pin_type);
      return '<div class="pin-row' + (isFaded(p) ? ' dim' : '') + '" onclick="focusPin(\'' + p.id + '\')" style="--c:' + t.color + '">' +
        '<span class="pin-row-icon">' + t.glyph + '</span><span class="pin-row-title">' + esc(p.title) + '</span></div>'; }).join('');
  }
  return pins.length
    ? '<div class="mp-empty">No pins match.</div>'
    : '<div class="mp-empty">No pins yet. Press <b>+ Add Pin</b>, then click the map.</div>';
}

function pinCountText() {
  const shown = listedPins().length;
  return shown === pins.length ? String(pins.length) : shown + ' of ' + pins.length;
}

function listHtml() {
  return '<div class="panel-title">Pins (<span id="pin-count">' + pinCountText() + '</span>)</div>' +
    (pins.length ? '<input type="search" id="pin-search" placeholder="Search pins…" value="' + esc(pinSearch) + '" oninput="onPinSearch(this.value)">' : '') +
    '<div id="pin-rows">' + pinRowsHtml() + '</div>' +
    '<div class="mp-hint" style="margin-top:1rem">Scroll to zoom, drag to pan. Click a pin to select it; a selected pin can be dragged to a new spot. ' +
    'The type chips above the map hide pins from both the map and this list. The Events key (top right of the map) lists what happens in the world: pick an event (here or in the Year view bar) to show only its pins.</div>';
}

function onPinSearch(v) {
  pinSearch = v;
  $('pin-rows').innerHTML = pinRowsHtml();     // only the rows, so the search box keeps focus
  $('pin-count').textContent = pinCountText();
}

// ─── Type filter chips ───────────────────────────────────────────────────────
function renderFilters() {
  const el = $('mv-filters');
  const counts = {};
  pins.forEach(p => { counts[p.pin_type] = (counts[p.pin_type] || 0) + 1; });
  hiddenTypes.forEach(t => { if (!counts[t]) hiddenTypes.delete(t); });   // type no longer used by any pin
  const types = Object.keys(PIN_TYPES).filter(t => counts[t]);
  if (types.length < 2 && !hiddenTypes.size) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = types.map(t => { const d = PIN_TYPES[t];
      return '<button class="mv-chip' + (hiddenTypes.has(t) ? ' off' : '') + '" style="--c:' + d.color + '" onclick="toggleType(\'' + t + '\')">' +
        d.glyph + ' ' + d.label + '<span>' + counts[t] + '</span></button>'; }).join('') +
    (hiddenTypes.size ? '<button class="mp-btn" onclick="clearTypeFilter()">Show all</button>' : '');
}

function toggleType(t) {
  if (hiddenTypes.has(t)) hiddenTypes.delete(t); else hiddenTypes.add(t);
  renderPanel();
}
function clearTypeFilter() { hiddenTypes.clear(); renderPanel(); }

// Hide/show map markers. A pin you are selecting or editing always stays visible.
function applyFilters() {
  if (!lmap) return;
  pins.forEach(p => {
    const mk = markers.get(p.id);
    if (!mk) return;
    const keep = !hiddenTypes.has(p.pin_type) || p.id === selectedId || (formState && formState.pin && formState.pin.id === p.id);
    if (keep && !lmap.hasLayer(mk)) mk.addTo(lmap);
    else if (!keep && lmap.hasLayer(mk)) mk.remove();
  });
}

// ─── Rename map ──────────────────────────────────────────────────────────────
function startRename() {
  if (!currentMap || renaming) return;
  renaming = true;
  const el = $('mv-name');
  el.innerHTML = '<input class="mv-name-input" id="rename-input" maxlength="120" value="' + esc(currentMap.name) + '">';
  const inp = $('rename-input');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finishRename(inp.value); }
    else if (e.key === 'Escape') { e.stopPropagation(); finishRename(currentMap.name); }   // same name = no change
  });
  inp.addEventListener('blur', () => finishRename(inp.value));
}

async function finishRename(value) {
  if (!renaming) return;
  renaming = false;
  const name = value.trim();
  const el = $('mv-name');
  if (!name || name === currentMap.name) { el.textContent = currentMap.name; return; }
  const { error } = await supabase.from('maps').update({ name }).eq('id', currentMap.id);
  if (error) { alert('Could not rename: ' + error.message); el.textContent = currentMap.name; return; }
  currentMap.name = name;
  const m = maps.find(x => x.id === currentMap.id); if (m) m.name = name;
  el.textContent = name;
  document.title = name + ' · Map Pinboard';
}

// ─── Replace map image ───────────────────────────────────────────────────────
async function replaceImage(input) {
  const file = input.files[0];
  input.value = '';
  if (!file || !currentMap) return;
  const ext = EXT_FOR_TYPE[file.type];
  if (!ext) return alert('Only PNG, JPEG or WebP images are supported.');
  if (file.size > MAX_BYTES) return alert('That file is over 25 MB. Try a smaller or compressed version.');

  const btn = $('replace-btn');
  const label = btn.textContent;
  let info = null;
  const uploaded = [];
  try {
    info = await readImage(file);
    const oldRatio = currentMap.image_width / currentMap.image_height;
    const newRatio = info.width / info.height;
    if (Math.abs(newRatio / oldRatio - 1) > 0.01 &&
        !confirm('The new image has a different shape (' + info.width + '×' + info.height + ' vs ' + currentMap.image_width + '×' + currentMap.image_height + ').\n\n' +
                 'Pins keep their relative position (% across / % down), so some may no longer sit on the places they mark. Replace anyway?')) return;

    btn.disabled = true; btn.textContent = 'Uploading…';
    // A fresh filename each time avoids stale CDN/browser caches of the old image.
    const newPath = currentUser.id + '/' + currentMap.id + '/base-' + Date.now() + '.' + ext;
    const up = await supabase.storage.from(BUCKET).upload(newPath, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    uploaded.push(newPath);

    const { error } = await supabase.from('maps').update({ image_path: newPath, image_width: info.width, image_height: info.height }).eq('id', currentMap.id);
    if (error) throw error;
    uploaded.length = 0;     // the DB now points at the new file, so never clean it up past this point

    const oldPath = currentMap.image_path;
    try {
      const thumb = await makeThumb(info.img, 480);
      if (thumb) await supabase.storage.from(BUCKET).upload(thumbPath(currentMap), thumb, { contentType: 'image/jpeg', upsert: true, cacheControl: '60' });
    } catch (e) { console.warn('thumbnail skipped', e); }
    if (oldPath && oldPath !== newPath) await supabase.storage.from(BUCKET).remove([oldPath]);

    Object.assign(currentMap, { image_path: newPath, image_width: info.width, image_height: info.height });
    const m = maps.find(x => x.id === currentMap.id); if (m) Object.assign(m, currentMap);
    await openMap(currentMap.id, ++routeToken);      // rebuild the view with the new image
  } catch (e) {
    if (uploaded.length) await supabase.storage.from(BUCKET).remove(uploaded);
    alert('Could not replace the image: ' + (e.message || e));
  } finally {
    if (info) URL.revokeObjectURL(info.url);
    btn.disabled = false; btn.textContent = label;
  }
}

// All timeline events linked to a pin, oldest first.
function eventLinkHtml(pin) {
  const ids = pin.event_ids || [];
  if (!ids.length) return '';
  const evs = ids.map(id => tlEvents.find(e => e.id === id)).filter(Boolean).sort((a, b) => a.year - b.year);
  if (!evs.length) return '<div class="pv-link"><div class="pv-link-label">Timeline events</div><div class="mp-hint">' +
    (tlError ? 'Timeline could not be loaded.' : 'Linked events not found.') + '</div></div>';
  return '<div class="pv-link"><div class="pv-link-label">Timeline events (' + evs.length + ')</div>' +
    evs.map(ev => {
      const desc = (ev.description || '').trim();
      return '<div class="pv-ev">' +
        '<div class="pv-link-main">⧗ ' + esc(ev.title) + ' · ' + esc(eventYearLabel(ev)) + '</div>' +
        (desc ? '<div class="pv-link-desc">' + esc(desc.length > 160 ? desc.slice(0, 160) + '…' : desc) + '</div>' : '') +
        '<a href="../timeline/index.html#event=' + ev.id + '">View on timeline →</a></div>';
    }).join('') + '</div>';
}

// Map events (from the key) this pin belongs to; clicking one highlights it on the map.
function mapEventsHtml(pin) {
  const evs = mapEvents.filter(e => e.pin_ids.includes(pin.id)).sort(byStart);
  if (!evs.length) return '';
  return '<div class="pv-link"><div class="pv-link-label">Map events (' + evs.length + ')</div>' +
    evs.map(ev => '<div class="pv-ev"><div class="pv-link-main">⚑ <span class="pv-act" onclick="selectEvent(\'' + ev.id + '\', true)">' + esc(ev.title) + '</span> · ' + esc(eventRangeText(ev)) + '</div></div>').join('') + '</div>';
}

function childLinkHtml(pin) {
  if (!pin.child_map_id) return '';
  const m = maps.find(x => x.id === pin.child_map_id);
  return '<div class="pv-link"><div class="pv-link-label">Opens map</div>' +
    '<div class="pv-link-main">' + esc(m ? m.name : 'Map not found') + '</div>' +
    (m ? '<button class="mp-btn mp-btn-primary" onclick="location.hash=\'#map=' + m.id + '\'">Open map →</button>' : '') + '</div>';
}

// <option>s for the "add a timeline event" picker, grouped by Age (same order as the timeline page).
// Events already linked to the pin are left out.
function eventOptionsHtml(excludeIds, placeholder, selectedId) {
  let html = '<option value="">' + esc(placeholder || '+ Add a timeline event…') + '</option>';
  const byYear = (a, b) => a.year - b.year;
  const avail = tlEvents.filter(e => !excludeIds.includes(e.id));
  const groups = tlAges.slice().sort((a, b) => a.start_year - b.start_year)
    .map(a => ({ label: a.name, evs: avail.filter(e => e.age_id === a.id).sort(byYear) }));
  groups.push({ label: 'Unassigned', evs: avail.filter(e => !tlAges.some(a => a.id === e.age_id)).sort(byYear) });
  groups.filter(g => g.evs.length).forEach(g => {
    html += '<optgroup label="' + esc(g.label) + '">' +
      g.evs.map(e => '<option value="' + e.id + '"' + (e.id === selectedId ? ' selected' : '') + '>' + esc(eventLabel(e)) + '</option>').join('') + '</optgroup>';
  });
  return html;
}

function childOptionsHtml(selectedId) {
  return '<option value="">— none —</option>' +
    maps.filter(m => m.id !== currentMap.id).sort((a, b) => a.name.localeCompare(b.name))
      .map(m => '<option value="' + m.id + '"' + (m.id === selectedId ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('');
}

function pinHtml(pin) {
  const t = typeOf(pin.pin_type);
  return '<div class="pv-title">' + esc(pin.title) + '</div>' +
    '<div class="pv-type" style="--c:' + t.color + '">' + t.glyph + ' ' + t.label + '</div>' +
    timeStateHtml(pin) +
    (pin.description ? '<div class="pv-desc">' + esc(pin.description) + '</div>' : '<div class="mp-hint" style="margin-bottom:1rem">No description yet.</div>') +
    mapEventsHtml(pin) + eventLinkHtml(pin) + childLinkHtml(pin) +
    '<div class="pv-actions">' +
      '<button class="mp-btn mp-btn-primary" onclick="beginForm(\'edit\', pins.find(p => p.id === selectedId))">Edit</button>' +
      '<button class="mp-btn" onclick="selectPin(null)">Close</button>' +
      '<button class="mp-btn mp-btn-danger" onclick="deletePin(\'' + pin.id + '\')">Delete</button>' +
    '</div>' +
    '<div class="mp-hint" style="margin-top:1rem">Drag this pin on the map to move it.</div>';
}

function formHtml() {
  const isNew = formState.mode === 'new';
  const pin = formState.pin || {};
  return '<div class="panel-title">' + (isNew ? 'New Pin' : 'Edit Pin') + '</div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-title">Title</label>' +
      '<input type="text" id="pf-title" maxlength="120" value="' + esc(pin.title || '') + '" onkeydown="if(event.key===\'Enter\')savePin()"></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-type">Type</label>' +
      '<select id="pf-type" onchange="onFormTypeChange(this.value)">' +
      Object.entries(PIN_TYPES).map(([k, t]) => '<option value="' + k + '"' + (k === formState.type ? ' selected' : '') + '>' + t.glyph + ' ' + t.label + '</option>').join('') +
      '</select></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-desc">Description</label>' +
      '<textarea id="pf-desc">' + esc(pin.description || '') + '</textarea></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Exists from</label>' + yearFieldHtml('ps', pin.start_year) +
      '<span class="mp-hint">Leave blank if it has always been there.</span></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Until</label>' + yearFieldHtml('pe', pin.end_year) +
      '<span class="mp-hint">Leave blank if it still exists today. Outside these years the pin fades in the Year view.</span></div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Map events (optional)</label>' +
      '<div id="pf-mevents">' + formMapEventsHtml() + '</div>' +
      (eventsError ? '<span class="mp-hint">Events could not be loaded: ' + esc(eventsError) + '</span>'
        : !mapEvents.length ? '<span class="mp-hint">No events on this map yet. Add them with + in the Events key on the map.</span>' : '') + '</div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label>Timeline events (optional reference)</label>' +
      '<div id="pf-events">' + formEventsHtml() + '</div>' +
      (tlError ? '<span class="mp-hint">Timeline could not be loaded: ' + esc(tlError) + '</span>'
        : !tlEvents.length ? '<span class="mp-hint">No timeline events yet — add some in the Timeline Builder.</span>' : '') + '</div></div>' +
    '<div class="mp-form-row"><div class="mp-form-field"><label for="pf-child">Opens map (optional)</label>' +
      '<select id="pf-child">' + childOptionsHtml(pin.child_map_id) + '</select>' +
      (maps.length < 2 ? '<span class="mp-hint">Create another map to link a pin to it (e.g. a city map).</span>' : '') + '</div></div>' +
    '<div class="mp-hint" id="pf-coords" style="margin-bottom:.8rem"></div>' +
    '<div class="pv-actions">' +
      '<button class="mp-btn mp-btn-primary" id="pf-save" onclick="savePin()">' + (isNew ? 'Add Pin' : 'Save') + '</button>' +
      '<button class="mp-btn" onclick="cancelForm()">Cancel</button>' +
      (isNew ? '' : '<button class="mp-btn mp-btn-danger" onclick="deletePin(\'' + pin.id + '\')">Delete</button>') +
    '</div><div class="mp-status" id="pf-status"></div>';
}

// ─── Keyboard ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (addMode) setAddMode(false);
  else if (formState) cancelForm();
  else if (evForm) cancelEventForm();
  else if (selectedId) selectPin(null);
  else if (selectedEventId) selectEvent(selectedEventId);
});

// ─── Init ────────────────────────────────────────────────────────────────────
async function boot(user) {
  currentUser = user;
  await route();
}
(async function init() {
  boot(await requireAuth());
})();
</script>
